---
layout: default
---
<div class="wrap">
  <header class="page-head">
    {% if page.nav == "record" %}<p class="crumb"><a href="{{ '/record/' | relative_url }}">The Record</a> / {{ page.title | remove_first: "The " | capitalize }}</p>{% elsif page.kicker %}<p class="crumb">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.dek %}<p class="dek prose">{{ page.dek }}</p>{% endif %}
  </header>
  <div class="md prose{% if page.wide %} wide{% endif %}"{% if page.wide %} style="max-width:none"{% endif %}>
{{ content }}
  </div>
</div>
