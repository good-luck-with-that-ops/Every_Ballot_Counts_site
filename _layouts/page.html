---
layout: default
---
<div class="wrap">
  <header class="page-head">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.dek %}<p class="dek prose">{{ page.dek }}</p>{% endif %}
  </header>
  <div class="md prose{% if page.wide %} wide{% endif %}"{% if page.wide %} style="max-width:none"{% endif %}>
{{ content }}
  </div>
</div>
