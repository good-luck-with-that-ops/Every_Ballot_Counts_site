<style>
/* EBC & [POI] Profiles */
.pf-band{background:#14213d;margin:0 0 28px}
.pf-band img{display:block;width:100%;max-width:1456px;height:auto;margin:0 auto}
.cf-mark.pf{background:#14213d}.cf-mark.pf img{width:100%}
.pf-tier{font:15px/1.45 var(--sans);color:var(--ink-2);margin:10px 0 0}
.pf-list{display:grid;gap:0;margin-top:24px;border-top:2px solid var(--ink)}
.pf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;padding:16px 0;border-bottom:1px solid var(--hair);text-decoration:none;color:var(--ink)}
.pf-row:hover .pf-nm{text-decoration:underline}
.pf-nm{font:700 19px/1.25 var(--sans)}
.pf-now{grid-column:1;font:15px/1.4 var(--sans);color:var(--ink-2)}
.pf-ct{grid-column:1}
.pf-st{grid-column:2;grid-row:1/4;align-self:center;font:700 12px/1 var(--mono);letter-spacing:1px;text-transform:uppercase;padding:7px 10px;border:1.5px solid var(--ink);white-space:nowrap}
.pf-st.w{background:var(--amber);color:#14213d;border-color:#14213d}
.pf-roles,.pf-tl{list-style:none;margin:0;padding:0}
.pf-roles li,.pf-tl li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--hair);font:16px/1.45 var(--sans)}
.pf-d{font-size:13.5px;font-weight:700;padding-top:2px}
.pf-s{display:block;font-size:13px;color:var(--ink-2);margin-top:4px}
main .pf-s a{background:none;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--ink-2);text-decoration-thickness:1px;text-underline-offset:3px}
.pf-s{line-height:1.55}
.pf-h1 .cobrand{font-size:.62em;vertical-align:.08em}
.pf-ties{list-style:none;margin:0;padding:0}
.pf-ties li{padding:12px 0;border-bottom:1px solid var(--hair);font:16px/1.45 var(--sans)}
.pf-post{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:center;border:1.5px solid var(--ink);padding:14px;text-decoration:none;color:var(--ink);max-width:720px}
.pf-post img{width:100%;height:auto;display:block}
.pf-post b{font:700 19px/1.3 var(--sans);display:block}
.pf-why li{margin-bottom:10px}
@media (max-width:700px){.pf-roles li,.pf-tl li{grid-template-columns:1fr;gap:4px}.pf-post{grid-template-columns:1fr}.pf-row{grid-template-columns:1fr}.pf-st{grid-column:1;grid-row:auto;justify-self:start}}
</style>
