    source: <a href="https://mississippitoday.org/2026/11/24/mississippi-experian-data-inactive-voters-discrimination/">Mississippi Today</a>
    html: 'the Secretary of State''s use of "unverified Experian data to clean the voter rolls" has drawn scrutiny; the law "can prevent voters from casting a normal ballot" on unverified move information; the ACLU "is weighing a legal challenge" and legislators plan changes in January. (R, WLOX, Nov 15): Watson: the affidavit ballot "is a catch-all. If we made any mistakes, any errors, we were caught by this affidavit process"; "Mississippi law didn''t change. The process didn''t change"; the state downloaded Experian data in July 2025 and "uploaded the rest of it to finish it up in 2026." <em>Sequence:</em> the official who ran the purge treats the ballots rejected in the count as the system working; the 2026 upload means the Experian data shaped this year''s rolls, not only 2025''s {P}. {R}'
