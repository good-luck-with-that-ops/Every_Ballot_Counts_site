    for Utah''s voter list with prejudice: "Utah''s SVRL is not subject to a Title III demand," and amendment "would be futile." <em>Meaning {P}:</em> the 52 U.S.C. 20701 route to full state voter files is losing in court; the grand-jury route is what remains. {R} two FBI agents and two federal prosecutors, including Dan Bishop, the U.S. attorney named to prosecute election fraud nationwide, and Hugh Raymond Evans, the agent who signed the Jan 28 Fulton ballot-seizure affidavit, questioned Fulton''s 2020 elections director Richard Barron for more than two hours. NYT (via summary): 10 months after the seizure, 260 analysts assigned, no charges. {R}'
