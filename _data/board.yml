    html: 'order text: "Pending further order of the court, the three-judge panel order filed on November 2, 2026, and previously vacated, is reinstated." Concurrence (Miller, Bennett): a district court "does not generally have the authority to enter an injunction prohibiting the Department of Justice from expressing its views about criminal statutes." Dissent (Murguia, with Gould, Owens, H.A. Thomas, Desai): "The majority permits Defendants to preempt state election procedures by threat of prosecution"; letters delivered "using uniformed DHS officers"; "Federal marshals reportedly served at least one county employee at home." (Thompson''s TRO later ended when plaintiffs dismissed the case Nov 6.) <em>Sequence:</em> the concurrence recasts prosecution warnings as protected speech by DOJ, which would cover warnings during the canvass and certification {P}. {D}'
