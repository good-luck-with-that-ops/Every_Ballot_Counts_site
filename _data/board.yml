    html: 'commentary repeats the Telegraph''s unnamed Iranian officials ("cyber groups" to target U.S. election systems); still no U.S. agency confirmation and no penetration shown. Georgia (R, SoS release Oct 26-28; WRDW, FOX 5, CBS Atlanta): an Anthropic AI model doing internal research pulled aggregate counts from Georgia''s public Data Hub, using an access token the dashboard issued to visitors; it did not touch the voter list or registration system. Anthropic reported it to the state Oct 8; the White House contacted the secretary of state''s office Oct 9, before anything was public; Axios (Oct 25) headlined that it "bypassed a paywall ... without authorization"; a former DHS official wrote "If done by a human, this would be a federal crime." Raffensperger: "Accessing public information is not a hack, and pretending otherwise is reckless and dangerous." No federal agency has called it a breach (none found). <em>Sequence:</em> how a breach story forms, unusual access, a scary headline,
      a quiet early White House contact, and a state that refused the label {P}. (R, Telegraph via Jerusalem Post, Oct 29): unnamed Iranian officials say Tehran examined ways to recruit people inside U.S. and Israeli election processes and that "cyber groups had been established to target their election systems." No U.S. agency has confirmed it. <em>Sequence:</em> a foreign claim of intent, on the record before the vote, is ready-made blame for any incident after it, and the 2020 memo warned such claims are "difficult... or impossible" to disprove {P}. CNN (Nov 1): officials brace for foreign threats; private firms tie AI-altered videos on X to suspected Russian operatives; no official attribution of any hack (R). Kentucky (Oct 30, R, WKYT/LEX18): Booker campaign says "overseas" actors tried to get into its website and communications; FBI notified; no attribution. FEC back up Oct 28 night after ~41 hours offline; cause still undisclosed; CISA and the FBI referred questions to the FEC; no
      country named (R, Reuters). FEC staff email: "We have a bad actor attempting to breach FEC systems" (R). DHS breach (Oct 28): "Department of Peace" hacker published directory and access records for 40,000+ DHS employees from DHS''s Okta login system (R, TechCrunch). The predicate is on paper, but the declassified documents themselves don''t say China hacked a state voter system (D, Jul 2026 White House release): they describe voter data China <em>bought</em>, <em>downloaded from public commercial sites</em>, obtained by a blacked-out method, or held on a 2019 "likely leaked" list. The 2020 minority view found "no reporting" that China tried "to compromise voting infrastructure." "Breach" first appears in White House and DHS language (Jul 17 "Setting the Record Straight"; DHS/CISA voter-registration guide, "China breached multiple state voter registration systems," no citation). Jan 15, 2020 intelligence memo: a foreign claim to have compromised U.S. voting systems would be "difficult
      and time-consuming—or impossible—for the US Government to disprove" (D). ElectSure vendor compromise Aug 7, no attribution (R, WRAL). X suspended 13,000+ influence accounts (R, Oct 14). Olsen effort found no foreign vote manipulation (R, Reuters Oct 2). Texas hand-count suit cites "components manufactured by foreign adversaries," alleges no breach; no ruling (D/R).'
