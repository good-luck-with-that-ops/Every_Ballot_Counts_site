    html: 'the court found no SORN covers DHS/DOJ''s compiled voter data, so its transmission to states is stayed (row 4). <em>Not to be confused with the 2025 SAVE case of the same name (League of Women Voters v. DHS, D.D.C. 1:25-cv-03501):</em> the SAVE overhaul did get two notices, DHS''s SAVE SORN (Oct 31, 2025) and SSA''s Numident SORN (Nov 12, 2025), both published months after SSN lookups went live in May 2025; Judge Sooknanan vacated both on June 22, and the Supreme Court stayed that ruling Sept 25, so SAVE runs under them pending appeal (D). <em>Sequence:</em> the obvious fix is a new SORN or routine use; watch the Federal Register for one, which would let DHS re-start the flow on paper {P}. FEMA IB 587 (D, Oct 7): the grant conditions requiring SAVE checks of the entire voter roll and every poll worker are rescinded only while the court order stands: "If the Court''s order is vacated or extinguished, the election administration conditions and 20% holdback will immediately become
      effective." ICE RFI ICERFI10222026 (D via HigherGov, Oct 22): a follow-on "web-based law enforcement investigative database subscription service" replacing the LexisNexis bridge, whose work statement required feeds into "ICE applications, such as but not limited to, Palantir platform, PenLink, and ICE Data Analytics." ICE''s $125M Thomson Reuters agreement (70CMSD26A00000008) shows $0 obligated on the agreement itself; four Sept 29 Thomson Reuters orders (about $7.2M) may be calls under it (D). State Department passport records open to "federal government verification platforms" for voter eligibility; outside routine uses Nov 23 (D, 91 FR 66906). SAVE revived Sept 25 (D). CISA''s first Palantir and Databricks buys, Sept 2026 (D). Treasury tip-system exemptions Nov 5 (D). 52 U.S.C. 20701 preservation invoked in all 50 states (R; row 2). DHS''s last-minute threat-intel platform (R, CNN Nov 1). {D}'
