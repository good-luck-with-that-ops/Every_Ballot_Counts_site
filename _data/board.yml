    html: '"Not passing THE SAVE AMERICA ACT (Voter I.D., Proof of Citizenship), sent up five times by the House, was devastating to the Republican Party in the Midterms"; ending the filibuster was the "greatest" missed chance. New (D, signed MOA, July 2, 2025): DHS-USCIS and the Wyoming Secretary of State (Chuck Gray) agreement to use SAVE "for voter registration and voter list maintenance purposes." <em>Sequence:</em> with the bill dead, proof of citizenship moves to SAVE agreements with cooperating states for 2028 {P}. Added Nov 12 as its own row. What carries over: the 52 U.S.C. 20701 preservation demands (22 months); DOJ''s appeals of 28 voter-roll losses (R, CBS); DOJ''s SAVE runs paused only while one D.D.C. order stands (D, 1st Cir. 26-1783 brief); Commerce''s untested EO 13873 route to machines (R); the Texas hand-count suit on "foreign adversary" parts (D, Potter County, fast-tracked); the 6 U.S.C. 677 incident authorities run to Nov 15, 2028 (D, 677g). Outside text names a "national
      emergency around the 2028 election" as the goal (R, American Thinker, Nov 2026). <em>Watch:</em> rulemaking or grant conditions on voting equipment, any federal certification change at the EAC, appellate wins on the roll suits {P}. {D}'
