    html: 'DOJ lists the statutes its letters rely on against officials: 18 U.S.C. 611 and 2; 52 U.S.C. 20511(2)(B) ("tabulation" of fraudulent ballots "by an election official"); 52 U.S.C. 10307(c), 21144; 18 U.S.C. 1015(f), 911; and 52 U.S.C. 20701-02 ("willful failure to preserve election records"), plus the "take Care" clause. It left blank the court''s questions on how the warnings differ from Section 11(b) intimidation and how they accord with Justice Manual 9-85.300 ("generally avoid interfering or appearing to interfere with election administration, tabulation, validation, or certification"). It refers to "grand jury proceedings in the Central District." {D}'
