  newest: 'the contractor order is now Executive Order 14439: "Protecting this information from unauthorized disclosure, including to members of the Congress, is vital"; contractors "must immediately" notify the White House of "any pending or future congressional request" and "abide by any instructions"; penalty: "potential debarment or suspension." (R, Politico, Nov 24): House Democrats asked Palantir, Flock, Clearview AI and nine other companies how DHS uses their technology. <em>Meaning {P}:</em> each of those companies must now tell the White House first and follow its withholding instructions, the order''s first test, five weeks before a Democratic House can subpoena. (D, <a href="https://public-inspection.federalregister.gov/2026-23931.pdf">NARA notice FR Doc. 2026-23931</a>, publishing Nov 24): a governmentwide revision of GRS 6.1, the Capstone schedule for officials'' email and electronic messages (DAA-GRS-2027-0001), is out for 30 days of comment. Text not yet read (U). (D, <a href="https://www.whitehouse.gov/presidential-actions/2026/11/protecting-the-executives-privileges-and-enhancing-efficiencies-in-federal-contracting/">executive
    order</a>, Nov 20): "Protecting the Executive''s Privileges and Enhancing Efficiencies in Federal Contracting": all federal contractors and subcontractors "must immediately" notify the White House and their agencies "of any pending or future congressional request respecting the contractors'' communications or work with the executive branch; and abide by any instructions received from the White House and contracting agency related to the withholding of communications"; OMB writes compliance guidance; agencies "shall consider" "termination or cancellation of contracts and the potential debarment or suspension" for noncompliance. It says Congress "cannot seek information from ... Federal contractors without a valid legislative purpose that does not intrude on core Executive functions." <em>Sequence:</em> the Nov 11 White House letter to Congress, the Nov 16 Scharf testimony memo, Blanche''s Nov 16 "advising them not to fold," then this order four days later; it closes the vendor route (Palantir,
    Peraton, L3Harris, Cantor''s and True the Vote''s counterparts) before Jan 3 {P}. Watch which contractors refuse congressional letters and cite it. (D, <a href="https://www.heritage.org/press/heritage-foundation-welcomes-patrick-davis-general-counsel">Heritage release</a>, Nov 17): Patrick Davis, the Senate-confirmed Assistant Attorney General who managed "the department''s relationship with Congress," is now Heritage''s general counsel. <em>Sequence:</em> DOJ''s point person with Congress leaves for Project 2025''s sponsor as House Democrats prepare oversight; no successor is reported {P}. (R, Washington Post, Nov 14; Fox News, Nov 11): Miller''s first memo says "The White House will run a clear and regular policy process through the Deputy Chief of Staff for Policy" and the national security adviser; per the Post, all West Wing policy decisions now flow through Caleb Orr or Rubio, and the economic and domestic policy councils are not mentioned. Mailman is compiling executive-order
    "wins" for the last two years. <em>Sequence:</em> with the Scharf memo gating testimony and this memo gating policy, the approval points sit with a handful of people tied to Rubio and Miller {P}. (R, Forbes, Washington Post, WIRED, Nov 18): incoming Oversight chair Robert Garcia sent preservation letters to about a dozen Trump allies, including Stephen Miller and JD Vance. (R, Broadband Breakfast, Nov 17): FCC Chair Carr will need White House approval to appear before House Democrats next year under the Scharf memo. Syntheses: TPM, "With Democrats on the Cusp of Control, Trump Administration Seeks to Curtail Congress'' Power" (Nov 17); Jack Goldsmith, "Is the Eric Ueland Nomination for Comptroller General a Threat to Congress?" (Executive Functions, Nov 17) (R). (R, Axios, Denver Gazette, PBS, Nov 16): White House counsel Will Scharf''s one-page memo to agency general counsels: "agencies must notify and obtain approval from both his office and the Office of Legislative Affairs" before
    testifying to Congress, an "established White House consultation process"; "further guidance regarding other engagements with Congress is forthcoming." Scharf on subpoena compliance: "it depends." <em>Sequence:</em> the White House now decides which agency witnesses Congress hears, seven weeks before a Democratic House is seated, and has said informal contacts are next; with the OLC opinion covering outsiders, the response to oversight is complete before the first subpoena {P}. (R, Politico via Yahoo, Washington Sun, Nov 16): Trump nominated OMB Deputy Director for Management Eric Ueland as Comptroller General; HSGAC hearing Thursday Nov 19; GAO "has issued more than a half-dozen findings of illegal impoundment" this term (row 22). (R, Fox News Sunday via Yahoo and Washington Examiner, Nov 15): White House counsel Scharf: Democrats "are intent on threatening and intimidating members of this administration from the president on down to the most junior staffer"; "they''re going to be met
    with a vigorous response from my office and from the Department of Justice every single time." Blanche (Fox, Nov 15): incoming Democrats are "acting like prosecutors"; "we''re not going to just stand by willingly"; per Tampa Free Press he said the administration is advising private companies and supporters not to fold under congressional pressure. <em>Sequence:</em> the response to subpoenas is set before any subpoena exists, and DOJ is the named instrument {P}. (R, NYT, Nov 14): DOJ''s Office of Legal Counsel "over the summer quietly published an opinion asserting that even communications by those outside government could be covered by executive privilege if they concerned Mr. Trump and his top aides"; Rachel Jag, a former Jim Jordan staffer, coordinates DOJ''s response to subpoenas; the White House counsel''s office added two oversight lawyers; Scharf: "I meant everything I said," and he is "collecting examples" of lawmakers'' statements. <em>Sequence:</em> donors and outside allies
    get a privilege shield before the first subpoena, and the "no legislative purpose" record is being built in advance; criminal contempt referrals would go to the same DOJ {P}. (D, NARA notice FR 2026-23018, Nov 12): NARA "is discontinuing the practice of publishing a separate notice in the Federal Register to announce the issuance of a new General Records Schedule (GRS) Transmittal"; new schedules will appear only on its website and in emails to agencies. <em>Sequence:</em> the government-wide rules for when records may be destroyed stop appearing in the Federal Register; watch NARA''s GRS page for changes to election, IT-security or law-enforcement records {P}. (D, DOJ OIG 26-064, June 2026): DOJ''s system inventory (JCAM) is "inconsistent, incomplete, and outdated"; "over half of the sampled component inventory records we examined lacked required privacy documentation"; a Marshals system ran "outside of the Department''s cybersecurity oversight." FISMA''s annual IG evaluations go to
    OMB and need not be made public (44 U.S.C. 3555(e)-(f)); DOJ OIG posts two-page summaries. FY2026 audits cover JMD, FBI, Marshals, ATF, Federal Prison Industries and the immigration courts (EOIR); summaries due about Feb-Mar 2027. <em>Sequence:</em> where DOJ keeps the state voter rolls it collected, and whether that system has a privacy assessment or is labeled a national security system, is not public; the inventory audit says many DOJ systems lack the paperwork {P}. History (R, Law Dork, The Hill, Nov 9; overtaken Nov 25 by the Fahey paperwork): OLC head Elliot Gaiser was to be nominated to the Northern District of Texas in the lame duck; Civil Division head Brett Shumate resigned, the fourth DOJ official out in a week (https://news.bgov.com/us-law-week/doj-lawyer-gets-nod-for-texas-court-in-last-minute-judicial-push ; https://gvwire.com/2026/11/09/head-of-us-justice-departments-civil-division-has-resigned-says-blanche/). (R, Washington Post, Nov 8): DOJ braces for congressional subpoenas;
    the story cites an OLC executive-privilege opinion released earlier this year. <em>Sequence:</em> the privilege position is written before the first subpoena {P}. (R, Nov 7): Trump calls Democrats'' promised oversight of DOJ, DHS and the White House "extortion" and orders DOJ to investigate it (row 10). <em>Sequence:</em> the next check on the executive, House oversight from Jan 3, is framed as a crime before it starts {P}. (R, Nov 3): the en banc stay ends the only court order requiring DOJ to disclose pending ballot-warrant applications and grand-jury subpoenas (row 2). Required pre-election intelligence reports to Congress not delivered; FMIC cut; CISA staff cut (R, CBS). Classified briefing for election officials postponed Oct 15, later held (R, CNN). DOJ/DHS answer to Boasberg excludes all oral and informal contacts (R, Oct 30). The list given to outside researchers was stripped to 8 columns (R, Nov 1; row 4). The compiled voter database ran without the public notice the Privacy
    Act requires (D, Chutkan, Nov 2; row 4). {D}'
