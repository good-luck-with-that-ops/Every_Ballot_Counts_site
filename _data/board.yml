  changed: '2026-11-02'
  newest: 'New (D, SAVE list x ICE 287(g) list): all 28 state election offices registered for SAVE voter checks are in states with 287(g) agreements; the four Guard-287(g) states (TX, FL, AR, WV) all have their election office in SAVE; Lancaster County, Pa., has both a DA 287(g) agreement and a SAVE-registered elections board. (D, <a href="https://www.ice.gov/identify-and-arrest/287g">ICE 287(g) page and spreadsheet</a>, as of Nov 19): 2,807 agreements; 68 signed Nov 1-18; task-force agreements for the attorneys general of Texas (Jan 30, 2025), Mississippi (Mar 17, 2025), Louisiana (Jul 30, 2026) and Indiana (Sep 25, 2026), 18 district attorneys'' offices (Terry County, Tex., Nov 5 and Oklahoma''s 22nd District, Nov 18, after the election), and the Texas, Florida, West Virginia and Arkansas National Guards. <em>Meaning {P}:</em> the Mississippi AG is both on DOJ fraud-division money ($2.52M, below) and holds immigration-officer powers. (D, USAspending, ALN 16.076): 30 Special Attorneys awards,
    about $47.1M, mostly from Jun 1, pay state and local prosecutors "TO SERVE AS SPECIAL ATTORNEYS UNDER THE DIRECTION OF THE NATIONAL FRAUD ENFORCEMENT DIVISION ... OR TO SERVE AS SPECIAL ASSISTANT UNITED STATES ATTORNEYS," including the State of Alaska Department of Law ($2.89M), the Mississippi AG ($2.52M), North Carolina''s courts ($11.64M) and Ohio''s AG and Auditor. <em>Sequence:</em> both undecided Senate states have state prosecutors on DOJ fraud-division money {P}. (D, DOJ release Nov 2): charges against 63 people, "including four illegal aliens"; by our count at least 54 are lawful permanent residents, mostly for votes in 2024 or earlier; each named with age and nationality, with photos. Blanche: "the largest surge of voter-fraud arrests since President Trump returned to office"; DOJ says it has charged "195 aliens across 25 states" in nine weeks and "239 people" since January 2025. <em>Sequence:</em> an election-eve roll call of named, pictured green-card holders is a message
    to every immigrant household about voting, whatever the merits of each case {P}. (R, KJZZ Nov 2; USAO release Oct 30): Arizona U.S. Attorney Timothy Courchaine announced an investigation of Stand Indivisible Arizona, Worker Power and When We Count, referred it to the FBI and wrote Maricopa Recorder Heap and Secretary of State Fontes asking them to review registrations the groups submitted. The videographer says "absolutely no voter registrations were submitted"; a former U.S. Attorney calls it a "stark deviation" from DOJ norms. <em>Sequence:</em> a referral built on a sting with no registrations, aimed at registration groups the week of the vote, is the "investigating organizers" route running through the election lane {P}. (R, Oct 31): DHS General Counsel James Percival: "we will find you, we will charge you, and we will deport you"; says more than 200 charged in noncitizen-voting cases. DHS (D, Oct 28): "Dozens of Illegal Aliens Arrested In Nationwide Voter Fraud Crackdown", 13 examples,
    no totals. Mississippi (D, AG release Oct 6): the AG''s office "was awarded over $2.5 million by the U.S. Department of Justice in July 2026" for Joint Task Force Vigilance with both U.S. Attorneys and the FBI. DOJ''s $300M Special Attorneys Program also paid North Carolina''s State Auditor $1.9M (D, Oct 21). DOJ''s "Integrity in American Elections" grants (D, Oct 15): $5M for local prosecutors on "voter roll integrity and voter fraud"; applications due Dec 1 and Dec 8; money starts Jan 1, 2027; applicants must certify 8 U.S.C. 1373 compliance; priority to "immigration law enforcement operations" and 287(g) partners. Special Attorneys expansion (D, Oct 30): the $300M now also pays state and local investigators and analysts and the fraud center''s "data analytics team ... generating leads"; cross-designated prosecutors must be "willing to coordinate with federal immigration authorities." Partner states (D unless marked): Ohio''s LaRose uses "federal law enforcement resources and data"
    to review the voter database and referred a registration group to the FBI (Oct 26); Alabama''s Allen cites a "fraud prevention partnership with the Department of Justice"; Florida "nearly 900 referrals"; Texas AG Paxton arrests during early voting (Oct 31). DOJ charged 18 more in North Carolina (D, Oct 29). Operation Protect the Vote: 48 charged in five states (R, Votebeat). Reuters: 147 charged since Jan 2025 (R).'
