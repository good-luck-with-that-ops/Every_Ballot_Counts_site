    source: OGE 278-T reports released
    html: 'beyond the three firms the Washington Sun named, Davies bought CrowdStrike and Oracle on Apr 2 and AMD, Roper and GE Aerospace this spring, each $1,001-$15,000, after selling Palantir, NVIDIA, Palo Alto Networks, CoreWeave and other tech shares Feb 25-Mar 13; DoD certified the April report Jul 2 and OGE Jul 27. Benign reading: the sales fit a divestiture, and the buys sit in amounts the de minimis exemption can cover (one endnote cites it). Her ethics agreement is not yet pulled. (R, <a href="https://www.rawstory.com/pentagon-kristen-davies-new-report/">Raw Story citing the Washington Sun</a>, Nov 21): the Pentagon CIO named acting National Cyber Director bought shares in three firms that hold or supply Pentagon contracts this spring, despite an ethics agreement to avoid apparent conflicts; POGO: "a clear conflict of interest." (R, <a href="https://www.rawstory.com/stephen-and-katie-miller-2678483822/">Raw Story citing WSJ</a>, Nov 21): Miller plans to wind down "special government
      employee" status, which let staffers keep outside paychecks. (R, WaPo via summary, Nov 20): the Pentagon inspector general is auditing startup deals after the Post found $3.2 billion went to firms tied to Trump''s sons. (R, compiled by <a href="https://secondcongress.com/tracker/2026-05-11-senior-appointee-financial-conflicts">Second Congress</a> from ProPublica, NYT, WSJ, Reuters, NOTUS and others, through Oct 2026): the Pentagon''s $349 million in no-bid "other transaction" consulting deals with Alvarez &amp; Marsal Federal while Kollitides, its former partner, ran the offices buying (ProPublica, Oct 9); Feinberg''s open-ended use of Cerberus services while four Cerberus companies won Golden Dome work (ProPublica, Mar 5); DHS buying Daedalus''s five priciest planes on Noem''s last morning, with Wiles telling Mullin not to block it (NYT, Oct 4); Tether''s $6.3 million to Bo Hines''s firm during the GENIUS Act push (WSJ, Oct 14); Patel''s late-disclosed stake in DOJ contractor Strategy
      (NOTUS, Jul 1); Vance leasing from data-center developer Chuck Kuhn (Daily Beast, CNN, Jul 10); Barrack pushing his partner''s firm into an Iraq-Syria pipeline with no waiver (Reuters, Oct 9). Each official denies wrongdoing; none has been found by a court or IG to have broken the law (R). The OGE log shows no waiver on file for Venturella (D). New timeline rows . (R, CNBC via <a href="https://aiweekly.co/alerts/house-democrats-probe-lutnick-over-cantors-nvidia-holdings">AI Weekly</a>, Nov 19): Reps. Raskin, Meeks and Kamlager-Dove asked Cantor Fitzgerald''s Brandon Lutnick for records: Cantor held about $1.2 billion in Nvidia stock when Howard Lutnick was confirmed, and its reported share count fell nearly half between Sept 2025 and March 2026, while Commerce declined to blacklist Megaspeed. Cantor calls the allegations "baseless." Lutnick testifies to Senate Banking, reportedly Dec 10 (R). (R, The Atlantic via Just Security, Nov 18-19): special envoy Jared Kushner''s Affinity Partners
      acquired nearly 700,000 shares of defense contractor Arxis (F-35, destroyer, submarine and missile-defense parts) while he works on Russia-Ukraine talks. (R, NYT, Nov 18 headline): "In Bending to Trump, Law Firm Did $11.8 Million of Free Work for Administration." (D, Army release, Jun 13, 2025): "Detachment 201: The Army''s Executive Innovation Corps" swore in Palantir CTO Shyam Sankar, Meta CTO Andrew Bosworth, OpenAI Chief Product Officer Kevin Weil and former OpenAI research chief Bob McGrew as Army Reserve lieutenant colonels and part-time "senior advisors"; an Army spokesman said "safeguards will be in place to avoid conflicts of interest" and "Now we''re doing it ahead of wartime" (R, via Benzinga). The Army''s $10 billion Palantir enterprise agreement followed in July 2025 (R). <em>Sequence:</em> a vendor''s CTO in uniform, then the vendor''s biggest Army deal; Sankar was later reported the leading pick for CISA, and Palantir''s security chief is now the nominee {P}. The conflict
      safeguards are not public (U). (R, Washington Post, Nov 14): Katie Miller, wife of the chief of staff, denounced ChatGPT, Claude and Gemini over the past year "while holding a major financial interest in a rival company, Elon Musk''s xAI"; she denies being paid for posts. A Miller memo now requires counsel''s-office approval for White House meetings with lobbyists, exempting the Office of Public Liaison. The new policy deputy, Caleb Orr, earned $200K at Boyden Gray PLLC, whose clients for his work included America First Legal, Alliance Defending Freedom, Liberty Energy and Valero (D, OGE 278e via ProPublica). (R, ProPublica, Oct 30): ARPA-H director Alicia Jackson praised HHS''s removal of hormone-therapy warnings while holding at least $115,000 in Evernow, the company she founded; her husband holds $5M-$25M in Palantir stock and ARPA-H has a $19M Palantir contract; HHS says she is on leave. (R, Covers, CBS, Nov 13): Kalshi ended Donald Trump Jr.''s advisory role over his firm 1789
      Capital''s investment in rival Polymarket. (R, Reuters, FT, Nov 18): House Democrats ask Cantor Fitzgerald to preserve Nvidia records in a probe of Secretary Lutnick. (D, DOJ-Commerce joint statement, Nov 17): the departments say Commerce opened the Megaspeed probe in 2024, Nvidia put Megaspeed on its "no sell" list in June 2025 after a records request, and DOJ took the criminal lead; they credit "the Department of Commerce under Secretary Howard Lutnick" and speak "to address inaccurate information circulating in public reporting." It does not address the Kessler-Nvidia contact. (R, Just the News citing NYT and NY Post, Nov 11): Alina Habba Mildon, then a senior adviser to the Attorney General, took a reported $50 million general-counsel job with Concord Partners, founded by the daughter of banker Julio Herrera Velutini; weeks after she began, Trump pardoned him; she was fired after Trump called the deal "obnoxious and outrageous." CNBC (Nov 16, headline): "Trump''s accounts traded
      up to $97.5 million in Nvidia as Huang gained White House access" (R). (R, ProPublica via Political Wire, Medical Daily, Nov 9): "The Trump administration awarded a small biosecurity company nearly $40 million to screen for Ebola and other infectious diseases just months after a firm linked to President Donald Trump''s elder sons invested in its parent company" (an $18.8M CDC airport-screening contract and a $20M State Department contract to XpresTest, part of XWELL). (R, New York Times via The Next Web and Inquirer, Nov 9): Commerce agents building a case that Megaspeed was diverting Nvidia AI chips to China were contacted by Nvidia''s general counsel, who wrote that Jeff Kessler, a senior Commerce official who reports to Secretary Lutnick, had given Nvidia permission to contact them; the case later moved to a DOJ criminal inquiry. Commerce says it handled the case "strictly by the book," and a Commerce official says Kessler told the agents to do the same. (R, Axios, Nov 11): at a
      post-election Situation Room meeting Treasury Secretary Bessent asked Lutnick why Megaspeed had not been added to the Entity List; Axios counts at least three times this year Lutnick intervened in China actions. (R, Washington Post headline, Nov 16): Trump''s Nvidia stake "grew to as much as $62 million before scandal broke out"; Trump says he will not fire Lutnick (R, Politico). (R, NPR via WUNC, Gizmodo, Nov 9): Palantir hired former Sen. Jon Tester as an advisor on "the government services side" ahead of the Democratic Congress; former Sen. Mark Begich already lobbies for Palantir. <em>Sequence:</em> money and access follow the same path as the policy: the president''s family invests, a contract follows; at the department that polices chip exports, the company under investigation wrote that a senior official had cleared it to contact the agents {P}. <em>Watch:</em> the full Washington Post and CBS reporting on Lutnick and Nvidia; OGE filings; inspector-general or congressional referrals;
      new contracts to firms tied to officials'' families. {D}'
