    html: 'Judge Chutkan enjoins and stays (5 U.S.C. 705) DHS and DOJ "from further disclosing, transmitting, or releasing data purporting to constitute lists of individual potential or actual non-citizen voters or registered voters" to any state, county or local official who registers voters, issues or processes ballots, verifies signatures, or tabulates or certifies votes. Carve-outs: SAVE inquiries and "prosecuting violations of federal law." Compliance report within 24 hours naming "a senior official responsible." The court''s own description: DHS and DOJ "have collected millions of voting records—including those of U.S. citizens" and are "transmitting selected portions to states and localities." Plaintiffs allege (court recounting, not finding) "an unauthorized project to amass a national database of voter registration information," lists "from at least 47 states," "enhance[d]" with "commercially-acquired third-party data." Holding: bulk transmission likely violates the Privacy Act;
