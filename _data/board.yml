    html: 'at the SEIU v. DOJ hearing, AUSA Kenneth Kao agreed it is "fair" to say the California list has a high error rate. DOJ''s contempt/sanctions motion against CHIRLA (ECF 45) is still pending; Boasberg found CHIRLA''s expert "well qualified and credible" (D). (R, Democracy Docket Nov 1): the list DOJ produced had 8 fields, not ~30, omitted the California voter ID number, and was named "reduced columns." Washington (D, U.S. Attorneys'' letter Oct 26): DHS''s list covers people who "are or were noncitizens (i.e., they may have subsequently naturalized)"; "over 400 individuals and over 1,500 total votes"; a second DHS list was promised before Election Day (none seen as of Nov 3 morning). Mullin (R, Newsmax Oct 30): noncitizens on voter rolls "top 300,000." Trump (R, Truth Social Oct 31): "20,000, but potentially Hundreds of Thousands, and maybe even Millions." <em>Sequence:</em> the national number keeps growing while the one list that was tested keeps shrinking; that gap is what a
      post-election "the count is contaminated" claim would run on {P}. Oct 31 (R, Democracy Docket; CHIRLA filing): UCLA researchers matched at least 22 of CHIRLA''s verified citizen members to the 20,930-name DHS list with certainty, 66 more near-certain, and found 8,880 listed names (about 42%) not on California''s current voter file. LA County sample: about 1 in 4 list a U.S. birthplace (R). Oct 30 (R): DOJ named California and Washington; DHS named California, Nevada, Pennsylvania (July letters) and New Jersey. California: 20,930 names delivered Oct 13 (D); roll bought from the CA SoS, handed to HSI about Mar 19 (D). Washington: 405 names, Oct 26 (R). DHS says 17,000+ more records reviewed "on a rolling basis before the election" (D, Bartell ¶24). Built with LexisNexis Accurint, outside SAVE (D). {R}'
