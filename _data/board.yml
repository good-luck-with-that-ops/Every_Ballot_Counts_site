  history:
  - date: Nov 26
    source: ''
    html: 'RSS (when:1d) "foreign adversary" voting machines, voting machines hand count, election certification lawsuit, "critical infrastructure" election; Federal Register "foreign adversary" (FCC FARMS only); CISA: no advisory naming ES&amp;S, Hart or Dominion; no EO 13873/Commerce action on election equipment, no ODNI/FBI exam, seizure, DHS "debrief" or "voting logs."'
