    html: 'Commerce reassigned some of its fewer than 200 armed export-enforcement agents to Secretary Lutnick''s personal security, traveling "on his private jet" and guarding "his various homes," while Commerce held off blacklisting Megaspeed; Commerce: agents were "temporarily detailed to augment executive protection." The Commerce inspector general "last week began an evaluation of the bureau''s oversight of advanced-computing chips." (R, ProPublica, Nov 24): the Pentagon is weighing a $15 billion loan to a defense startup backed by Donald Trump Jr.''s venture firm, nearly twice the company''s estimated value; the Pentagon denies favoritism (R, headlines). (R, <a href="https://www.cnbc.com/2026/11/23/cnbc-transcript-president-donald-trump-speaks-with-cnbcs-eamon-javers-and-squawk-on-the-street-today.html">CNBC transcript</a>, Nov 23): on CNBC the day Nvidia reinstated Huang ("we have to protect our geniuses"; "the board decided to do what we wanted to do"), the President said: "I protected
      Elon in my first term. Very big, Elon was protected"; "You wouldn''t have an Elon if it wasn''t for me. And where you know that certain incident took place, which was you know a tough incident"; later, "we got to protect these people to a certain extent." A week earlier, per <a href="https://electrek.co/2026/11/24/trump-protected-elon-musk-first-term-tough-incident/">Electrek</a>, on Fox: "He was in big trouble." He named no incident, and the follow-up question on Musk went unanswered. The leading candidate in reporting is the 2018 SEC "funding secured" case, sued Sept 27 and settled Sept 29, 2018, under SEC Chairman Jay Clayton, who issued his own statement on the settlement (D, <a href="https://www.sec.gov/news/public-statement/clayton-settlements-elon-musk-and-tesla">SEC</a>). <em>Meaning {P}:</em> a President saying he shielded a CEO from a "tough incident," in the same breath as the Huang intervention, describes favors as policy. If the incident is the SEC case, that agency''s
      head was the current DNI; nothing sourced says the SEC acted at the President''s direction. {R}'
