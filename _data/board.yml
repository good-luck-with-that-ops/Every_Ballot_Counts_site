    html: 'the fraud task force matched USCIS''s E-Verify records against GSA''s SAM.gov contractor registry to flag 1,579 firms (row 25). No Privacy Act matching notice for this match was found in the Federal Register {P}. (D, TRM Labs release; R, Washington Sun and Bloomberg, Nov 18): the Threat Disruption Center runs inside the Homeland Security Task Force''s National Coordination Center with "more than 30 federal agencies and 440 state and local partners," using AI to "identify distinct components of criminal networks, as well as their victim footprints"; TRM Labs, "the super intelligence (SI) investigations company," is "the primary private-sector partner" under a no-bid award (about $95 million, to June 30, 2027) that "gives private-sector partners a direct role." EO 14390 (Mar 6) ordered this cell inside the National Coordination Center created by the "Protecting the American People Against Invasion" order (D). <em>Sequence:</em> a private network-mapping vendor now sits inside the
      immigration-enforcement coordination hub, with payments as the lever; the stated target is foreign scams, and nothing in the order limits the network analysis to them {P}. (R, 404 Media, Nov 18): "ICE Is Paying AT&amp;T to Dig Through a Mountain of Call Records" (headline; AT&amp;T also holds the FAA''s no-bid telecom network, row 3). (D, Databricks release, Mar 13, 2025): Databricks and Palantir join Palantir''s AIP/Foundry with the Databricks platform "through the combination of Unity Catalog through Delta Sharing and Palantir''s multimodal security system"; joint customers had used it for four months. (D, SAM notice 6973GH-26-J-data, Apr 9, 2026): the FAA buys Palantir Foundry on a single-source basis to "integrate, transform, and analyze disparate datasets originating from multiple operational systems." (D, USAspending, Nov 6): an IRS task order to Palantir to build an AI correspondence agent with semantic ontology governance (row 21). (D, Lenovo release, Jul 31, 2024): Lenovo
      became a Databricks systems-integration partner and ties the same AI stack to its World Cup 2026 role and an "AI command center." (D, AFGE v. OPM, S.D.N.Y., Oct 20): "OPM''s decision to grant DOGE Agents broad access to its systems of recordings containing PII has been held unlawful"; the court asked the parties for "input ... regarding the precise terms of relief" (the plaintiffs want copies deleted). (D, HIPAA final rule, publishes Nov 19): HHS widens who can receive health records without patient authorization, including "social services agencies" and "community-based organizations." <em>Sequence:</em> one vendor layer (Palantir with Databricks) now sits under ICE, IRS, CISA and the FAA, and the same partnership is sold for big-event command centers; a query that crosses those agencies needs no new database, only access {P}. <em>Watch:</em> new Foundry or Databricks orders at benefit, tax or election-adjacent agencies; data-sharing agreements or SORNs that name a vendor platform;
      the relief order in AFGE v. OPM, including whether copies are deleted. {D}'
