  history:
  - date: Nov 16
    source: FR 2026-23317, effective
    html: 'State''s online DS-11 passport pilot runs through America.gov: Login.gov takes ID, a "liveness detection check" using "facial recognition," and the Social Security Number, then passes the applicant''s information to State; adjudication involves "verifying the applicant''s citizenship records using system checks, including those from USCIS"; first naturalized citizens and prior passport holders, later birth certificates from "vital records authorities in a state that elects to participate." <em>Sequence:</em> America.gov, which already hosts DHS''s named-person voter-fraud form , becomes a front door for proving citizenship, with face, SSN and USCIS records joined in one flow; that is the federally verified citizenship credential SAVE-based voter checks lack {P}. Benign: faster passports. {D} a CMS-Education matching program for Medicaid eligibility, "community engagement" and the Multi-State Enrollment Prevention system . {D}'
    checked: false
  - date: Nov 12-13
    source: NPR, Axios, NYT
    html: 'Trump moved Vice President Vance off Iran to "the Massive Corruption and Crime taking place in Democrat run Cities and States," naming Minnesota, California and Illinois; NPR: the fraud task force Vance has led since March. <em>Sequence:</em> the program-integrity channel (fraud task force, Do Not Pay, SAVE) gets the vice president full time, aimed at Democratic states {P}. Added Nov 12 as its own row. HUD will run every assisted tenant, citizens and children included, through SAVE from Dec 14, with a duty to "inform DHS immediately" (D, FR 2026-23003). SSA wrote SAVE-derived citizenship into about 25 million records and is correcting 8.5 million more (D, SSA release Oct 20). State passport records open to "federal government verification platforms" from Nov 23 (D, 91 FR 66906). EO 14399 state citizenship lists (D; enjoined for 24 states). The Login.gov rulebook now requires fraud signals shared with agencies (D, NIST SP 800-63A-4). Benign: each has a stated program-integrity
      rationale and runs separately from elections. <em>Watch:</em> new SAVE user agencies, SORNs adding citizenship to benefit systems, any agency treating SAVE output as proof of citizenship {P}. {R}'
    checked: false
