since:
- 'Transportation Secretary Duffy says the FAA outage was not an attack and points at the contractor: "It wasn''t a foreign actor"; "We feel very comfortable that was the root cause"; "We''re going to hold people accountable". He says an L3Harris crew was working on the network when it failed; the FAA calls it an "equipment issue" during a telecommunications network upgrade (R, NPR, Nov 14). The President, by phone to Fox News, said it did not seem to be a cyberattack or AI (R, The Independent). {R}'
- 'The money ask came first: budget director Russ Vought and Duffy sent appropriators a $30.1 billion request the day before the outage. It calls earlier funding a "down-payment." At Friday''s briefing Duffy said, "the president has asked for $30 billion. I want $50 billion" (D, briefing). DHS also called the outage "a national security risk because our air traffic control system is outdated" (D, DHS release, Nov 13). {R}'
- The Homeland Security Secretary said the President "has declared this a national emergency" over Friday's air-traffic outage, and called DHS's job "continuity of government". He said the Department of War, CISA and the NSA were all working the response. No proclamation, executive order or emergency notice has been published (checked Saturday morning). He used the words to ask Congress for money; the same words, said about an election-night failure, are what this board watches for. {D}
- The FBI is looking at a software update as the cause of the FAA outage and does not think it was an attack. Officials still say they are "not going to rule that out." {R}
- The State Department will take first-time passport applications online through America.gov from Monday, with Login.gov checking each person's ID, face and Social Security number and USCIS checking citizenship. State birth records join later for states that opt in. {D}
- A federal judge in Minnesota found an ICE officer's "Aid and Abetting" memo accusing a federal public defender of a crime "reckless and false," and ordered prosecutors to retract it. Prosecutors had sent the memo to the local federal bar. {D}
- Mary Peltola leads Alaska's Senate race by about 10,400 votes with nearly all ballots counted; a Democrat won the governor's race. {R}
- 'Not seen as of Saturday morning: a published emergency declaration of any kind, a "significant incident" declaration, a new emergency directive, a major-incident notice, any federal finding about voting machines, a warrant or seizure, a Guard call-up, or any Mullin statement about the election (checked by name).'
