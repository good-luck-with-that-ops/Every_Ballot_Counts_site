    source: <a href="https://www.courtlistener.com/docket/75028945/88/potter-county-republican-party-v-benge/">Potter County v. Benge, ECF 88</a>
    html: 'the Texas suit to block certification until federal races were hand counted was dismissed without prejudice: "Plaintiffs do not have standing to challenge voting machines that have been affected by potentially hostile actors." (D, <a href="https://www.courtlistener.com/docket/75055469/39/united-states-of-america-v-state-of-alaska-et-al/">U.S. v. Alaska, 9th Cir. 26-7304, DktEntry 39</a>, Nov 19): DOJ concedes the case is moot ("there no longer exists any means" to sort the second Sullivan''s votes) but asks the court to vacate the ruling against it rather than affirm. It argues a court could have ordered "preservation and segregation of potentially tainted ballots," that "State law cannot, of course, stand in the way of court orders vindicating federal law," and that the contrary view "could have unpredictable consequences in future elections." Signed by Associate Attorney General Stanley Woodward. <em>Sequence:</em> DOJ gives up the 2026 fight in a way that would wipe out the
      one ruling against its ballot-segregation theory, keeping it ready for 2028 {P}. (R, Washington Post headline, Nov 18): "Peltola win doesn''t end DOJ scrutiny of Alaska Senate race, officials say"; Fox: "Hundreds of subpoenas fly in DOJ''s ''Decoy Dan'' probe as Democrat Peltola declared winner." <em>Sequence:</em> the federal criminal probe continues past the result toward the Nov 25 certification and the Jan 3 seating; Attorney General Blanche says it "doesn''t stop because of the election, no matter who wins or loses" (R). Fox and Newsweek describe it as a probe of the second Sullivan''s candidacy, with targets that include Marc Elias, whose firm represents Peltola''s campaign; the Juneau Independent calls it an investigation "of her campaign." DOJ has named no targets, and Peltola''s campaign denies wrongdoing (R). (R, AP, NBC, NPR, Alaska Beacon, Nov 18): Peltola wins the Alaska Senate race after the ranked-choice tabulation, giving Democrats 56 seats; Democracy Docket says the
      GOP "looks set to fight results." Certification Nov 25; DOJ''s Ninth Circuit appeal (26-7304) continues, with former Maricopa Recorder Stephen Richer and Richard Hasen as amici. (R, Democracy Docket, Nov 16): Peltola has 140,637 votes, "559 more than all three other candidates combined"; Trump posted a Bill O''Reilly video: Alaska Democrats "cheated" and "that''s going to lead to criminal prosecution." Tabulation Nov 18, certification Nov 25. (R, Media Matters, Nov 16): right-wing media figures and election-denial activists say Democrats "stole" the midterms (Texas, Alaska), call results mathematically "impossible," say voting machines were "part of the conspiracy," and call for "arrests" and "military tribunals." (Earlier Nov 16: Peltola about 157 votes short of a first-round majority, R, SSBCrack, Newsweek; now past it.) (D, Potter County ECF 72, Nov 14): the Texas suit now seeks a statewide pre-certification hand count of the federal races, results "corrected to match the hand count
      where they differ," and "confirm[ed]" by the ballots "from all lawful Texas citizens"; it cites preliminary reconciliation gaps (Harris -4,085, Dallas -544) as discrepancies (row 17). (R, Anchorage Daily News, NBC, Nov 14): Peltola now has a majority of counted votes and declared victory; NBC rates her likely to win; not called. (R, Alaska Public Media, Native News Online, The Hill, Nov 14): Peltola leads Sullivan by about 10,412 and nears 50% with about 96% of expected ballots counted; Democrat Jonathan Kreiss-Tomkins won the governor''s race. Amicus briefs from former Maricopa Recorder Stephen Richer and Richard Hasen back summary affirmance in DOJ''s Ninth Circuit appeal (D, 26-7304 ECF 17-18, Nov 13). <em>Sequence:</em> a majority outright blunts the ranked-choice "spoiler" theory; the "Rigged Election" record is what remains for a seating objection (row 19) {P}. (D, Trump on Truth Social, Nov 12): "Other than cheating, this is how they won the Midterms." Nov 9-10 posts now in
      hand as documents ("It''s all about the machines"; "There should be no question concerning this Rigged Election. Time is of the essence!!!"). (D, Sen. Ron Johnson, Nov 12): the PSI chairman says the Alaska "conspiracy to confuse voters ... has fractured confidence in our election system" and applauds "the FBI and DOJ for their prompt review"; his records deadline for three named people was Nov 12. <em>Sequence:</em> a Senate inquiry now runs beside the grand jury as the count favors Peltola; the "confidence" wording is the harm element of a significant incident and of EO 13848 {P}. Ninth Circuit No. 26-7304 released from mediation Nov 13 (D). (R, AP, Democracy Docket, Nov 11): Mississippi called for Colom; Hyde-Smith conceded ("I respect the decision of Mississippi voters"). (D, order read, Alaskans for Mary v. Dahlstrom, 3AN-26-10304CI, Nov 11): Judge Thomas Matthews granted the Division of Elections summary judgment; preliminary rejection lists are not final "public records" ("not
      reasonable" to produce mid-count); Peltola leads both Sullivans combined by 223 at 84% counted; Trump posted wrong totals Nov 10. (R, ProPublica, Nov 11): a Forsyth County, Ga., election-board member who belongs to the Election Integrity Network used ELLY data to question more than 22,000 names and dispute 69 voters after the vote; the board rejected his ballot challenges (https://www.propublica.org/article/election-challenge-forsyth-county-georgia). ELLY is a rebrand of EagleAI (R, Campaign Legal Center backgrounder, Aug 4). <em>Sequence:</em> the Mississippi contest route closes; Alaska and county-level challenges carry on {P}. (R, Democracy Docket, Nov 10): Trump: votes for Daniel J. Sullivan and Gerald Heikes "should immediately be given to the Real Dan Sullivan (Senator!)"; "There should be no question concerning this Rigged Election." On Nov 9: "Some early voting ''dumps'' were so large that it was impossible to win." <em>Sequence:</em> the president is building the "not honest"
      record for Alaska before the Nov 18 tabulation and Nov 25 certification; Democracy Docket flags a possible challenge to seating Peltola (Art. I, sec. 5) {P}. (R, Democracy Docket, Nov 10): in Hinds County, Miss., NRSC and Hyde-Smith observer Coy Westbrook loudly accused Election Commissioner Bobbie Graves of discussing ballots out of observers'' view ("Untoward, one might say"); she stopped work for the night. Colom leads by about 2,990 (R, WLBT, Nov 11); counties certify Nov 13. <em>Sequence:</em> a record of "irregularity" at the count in the Democratic stronghold, the likely basis for a contest {P}. (R, Democracy Docket, Nov 9): League of Women Voters of Alaska and Common Cause ask the Ninth Circuit (No. 26-7304) to summarily affirm the Alaska dismissal and seek sanctions; Peltola''s lead grows as counting continues (R, Anchorage Daily News, Alaska Beacon, Nov 9). Texas: Potter County moves to dismiss the hand-count-before-certification suit (D, county brief, Nov 9). Florida: a
      court lets the Miami-Dade official who already called Salazar''s race help with the recount (R). (R, MeidasTouch via Yahoo, Raw Story, Nov 9): Trump: "Does anybody really believe that this ''Election'' was honest. How could the Polls be so wrong???"; "It''s all about the machines, which are far more important than the voter!" <em>Sequence:</em> "machines" is the hook of the Texas hand-count suit and the reported draft emergency order on voting equipment; the president now attaches it to the whole result, before certification {P}. (R, Democracy Docket, Nov 7): a Florida Democrat sues to block the Miami-Dade elections supervisor from overseeing a recount in Rep. Salazar''s race, alleging bias. Mississippi: no new count reported since Colom +2,574 (Nov 6); about 20,000 ballots outstanding per the state GOP chair; Mike Hurst says a challenge would come "if and when" evidence emerges; any court fight likely after Nov 13 certification (R, Mississippi Free Press, Yahoo). (R, CBS, Nov 7):
      Trump: "The Alaska Race is OVER. Dan Sullivan WON, BY A LOT!" and "I don''t know what takes so long to announce his win," with Peltola ahead by about 637 at 74% counted; ranked-choice tabulation Nov 18, certification scheduled Nov 25 (R, CBS). (R, Mississippi Free Press, Nov 6): affidavit rejection by county: Chickasaw 48.5%, Benton 43.1%, Itawamba 34%, Alcorn 26.7%, Tishomingo 17%, Rankin about 20%; Watson: "roughly 80%" of 6,936 accepted statewide. (R, Democracy Docket, Nov 7): Georgia''s secretary of state is investigating 388 uncounted Seminole County votes that flip a state House seat; counties certify Nov 9. <em>Sequence:</em> a president declaring a winner before the count, in the one race where his DOJ sought to block certification, sets up the "stolen" story if the count goes the other way {P}. (R, Nov 6-7): Mississippi, Colom +2,574 (467,930 to 465,356, AP Friday evening); Rankin County has rejected about 20% of affidavit ballots so far; Hyde-Smith: "We are not backing down.
      This election is not over." Alaska, Peltola +637 at about 74% counted (ABC, Nov 7); her campaign sued the state for information on rejected mail ballots. Colorado: Boebert''s campaign, with attorney Scott Gessler, says it is "investigating" as she trails (https://www.democracydocket.com/news-alerts/boebert-campaign-investigating-voting-as-she-trails-her-democratic-challenger/). No DOJ filing in Mississippi found (checked). (D, Hyde-Smith campaign counsel letter, Nov 5, posted by the NRSC): demand to all 82 Mississippi counties to separate and preserve every affidavit ballot and related records (envelopes, pollbook data, audit logs, "video recordings of ballot storage areas") as "potential evidence in any box examination under § 23-15-911, election contest, or proceeding before the United States Senate." (R, Magnolia Tribune Nov 5): Colom +1,138; about 3,600 mail ballots and, per unconfirmed reports, upwards of 18,000 affidavit ballots still to be cured by Nov 10; counties certify Nov
      13. (R, Democracy Docket Nov 5): Trump calls for Alaska to transfer Daniel J. Sullivan''s votes to Sen. Sullivan. <em>Sequence:</em> the Mississippi fight now centers on the affidavit ballots the state''s inactivated voters had to use, and the incumbent names the Senate itself (Art. I §5) as a forum; no federal agency has joined yet {P}. (R, Al Jazeera/AP, Nov 5): Alaska, Peltola leads Dan Sullivan by 637 with nearly a quarter uncounted; ranked-choice results Nov 18. Mississippi, Colom leads by 1,138 (96%); Watson: "Counties have 10 days from the date of the election to submit their certified results to our office, which is November 13." Democracy Docket (Nov 4): Blanche vows to keep "fighting tooth and nail" on Alaska; if Hyde-Smith loses narrowly the GOP "will likely mount a legal effort to challenge ballots" and DOJ "could be joined." A CBS reporter''s post, relayed by Democracy Docket, says the White House is "not planning to push officials not to certify results" but "will be
      checking for irregularities" (R, secondhand). (R, Newsweek, Nov 3): Blanche on Fox: "There''s a scenario where the incumbent, Senator Sullivan, could lose"; "If it''s clear that voters were confused, and again, that''s why you need to preserve these ballots"; authorities could "look at the individual ballots." (R, IBTimes, TIME, Nov 3): at about 1 a.m. Trump posted "FAKE ALASKA CANDIDATE DANIAL J. SULLIVAN, JR., IS MISSING IN ACTION" and that "CORRUPT DUMOCRAT LAWYERS" are "SCARED STIFF OF BEING PROSECUTED"; asked about the results, he said he will respect them "if they are honest elections." Alaska suit dismissed Nov 1; DOJ appealed the same day, seeking to revive a bar on certifying "any result that may be impacted by voter confusion" (D/R); no emergency motion yet. Alaska (R): DOJ''s theory rests on the NVRA purpose line "protect the integrity of the electoral process" (R, Democracy Docket Nov 1). <em>Sequence:</em> reading a statute''s "integrity" purpose clause as federal power
      to hold certification is the loose-term paper trail in action {P}. Oct 30: DOJ seeks to "preserve and segregate all ballots ranking Daniel J. Sullivan"; Heyman confirms a criminal probe and a "significant surge of law enforcement assets to Alaska" (R, PBS). Trump, Oct 28: Peltola "should suffer the Legal and Political consequences" (R). Blanche (Oct 22): "Of course, there are scenarios…" (R). Trump (late Oct): a Minnesota Republican could lose only "if they cheat by playing games with the Ballots as they come in"; "The Federal Government will be watching closely" (R). Texas hand-count-before-certification suit before Kacsmaryk; no ruling (D/R). {D}'
