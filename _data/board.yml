  - date: Nov 23
    source: <a href="https://www.courtlistener.com/docket/75167735/stenstrom-v-schmidt/">Stenstrom v. Schmidt, ECF 2</a>
    html: 'a pro se TRO motion seeks a seven-day pause of PA-5 certification, alleging Delaware County Hart Verity 2.7 machines "counted his race without the prescribed software check." <em>Meaning {P}:</em> the machine claim is now aimed at 2026 results by private actors, with nothing federal behind it yet. Checked Nov 25 (evening): RSS (when:1d) for "foreign adversary" voting machines, "critical infrastructure" election, hand count election lawsuit: only Potter County dismissal coverage (Chron, San Antonio Current). No CISA advisory naming ES&amp;S, Hart or Dominion (10 KEVs today, none election vendors); no EO 13873/Commerce action on election equipment; no ODNI/FBI exam, seizure, DHS "debrief" or "voting logs." Fulton''s FBI-seized records stay with the county pending appeal (row 2). {D} every FCC equipment-authorization holder must attest to foreign-adversary control, doubt must be answered "yes," and the FCC moved to bar devices containing "logic-bearing hardware components produced
      by" Covered List firms, with "critical infrastructure" set by the 16 sectors (election systems are in Government Facilities). <em>Meaning {P}:</em> the documentary path for a "foreign-made parts" claim now runs through a public FCC list; the FCC texts do not mention elections. Checked Nov 25 (morning): RSS "foreign adversary" voting machines, Dominion ES&amp;S federal, hand count lawsuit certification: no new U.S. item beyond Potter County; no CISA advisory naming a vendor, no EO 13873 or Commerce ICTS action on election equipment, no ODNI/FBI machine exam, seizure, DHS "debrief" or "voting logs." {D}'
    checked: false
  - date: Nov 24
    source: <a href="https://www.courtlistener.com/docket/75028945/88/potter-county-republican-party-v-benge/">Potter County v. Benge, ECF 88-89</a>
    html: 'Judge Kacsmaryk dismissed the hand-count suit without prejudice for lack of standing. The plaintiffs had argued that Texas machines "contain components manufactured by foreign adversaries"; the court: "Plaintiffs do not have standing to challenge voting machines that have been affected by potentially hostile actors," and the slogan "election security is national security" "cannot be a Trojan horse for circumventing Article III." This replaces the Nov 24 line on the Nov 27/30 briefing schedule. <em>Meaning {P}:</em> the private route to a machine claim failed on standing; the routes that need no standing are executive ones (EO 13873, CISA, a "significant incident"). {D}'
    checked: false
  - date: Nov 27
    source: FCC FR Doc. 2026-24041, publishing
    html: 'a new FCC "Foreign Adversary Risk Management System" applies the same "foreign adversary" control test to every FCC licensee (row 26). (D, May 13 Federal Register, FR Doc. 2026-09671): the EO 13873 "foreign adversary" technology emergency was continued May 11 through May 2027. (D, National Security Determination, Mar 20; FCC DA 26-278, Mar 23): "routers produced in a foreign country" were added to the FCC Covered List, on a finding that "routers produced abroad" create "unacceptable ... national security ... risks"; only "Conditional Approvals" exempt a device. <em>Meaning {P}:</em> the test is where a device is made, not who owns the maker. That is the shape a "foreign-made parts" claim against voting equipment would take. Context (D, Amanda''s drop): EO 13873 (May 15, 2019) is the IEEPA national emergency on "foreign adversary" information and communications technology, the route a machine-parts claim would use; the White House''s Nov 20 Davies release lists "Blocked new foreign-made
      consumer routers deemed a national security threat" as an accomplishment. (D, <a href="https://www.courtlistener.com/docket/75028945/potter-county-republican-party-v-benge/">Potter County ECF 81-84</a>, Nov 19): Judge Kacsmaryk set the hand-count plaintiffs'' preliminary-injunction motion for Nov 23 (response Nov 27, reply Nov 30); the county filed a second motion to dismiss. (D, <a href="https://public-inspection.federalregister.gov/2026-23787.pdf">Federal Register notice 2026-23787</a>, publishes Nov 23): the EAC''s Technical Guidelines Development Committee meets Dec 15 on "the EAC Testing and Certification Program, the National Institute of Standards and Technology (NIST) Voting Program, the Voluntary Voting System Guidelines"; HAVA gives the EAC "decertification" power. Routine annual meeting; the agenda is not posted yet (D). Connecticut ordered recounts in five towns over a tabulator programming error (R, Hartford Courant headline); routine. Potter County: Benge filed a brief
      supporting her second motion to dismiss (ECF 83, Nov 19) (D, docket). (D, Potter County ECF 78-80, Nov 17): the court let a pro se supporter file an amica brief for the plaintiffs and denied the county''s motion to dismiss as moot after the amended complaint, so the statewide hand-count suit continues on the new complaint. (D, court record and lobbying filings, Nov 18): the Juniper routers are HPE products; HPE closed its purchase of Juniper on July 2, 2025, after a settlement the court found was negotiated with DOJ leadership over the Antitrust Division staff, with HPE contacts at the CIA, the Pentagon and NSA that "should have been disclosed" (D, court order, Aug 12). No official has said the routers were tampered with: FAA Administrator Bedford says there is "zero evidence of anything nefarious," and HPE says the device "functioned as it was configured to by the installer" (R). The FAA says it "has not yet determined the root cause" (D). <em>Watch:</em> any official who moves from
      "faulty configuration" to "compromised," and any appeal of the HPE judgment (deadline about Nov 30, {P}). {D}'
    checked: false
  - date: Nov 17
    source: ''
    html: 'no official has tied ARTEX, ConnectWise or the outages to voting equipment; no CISA advisory naming a vendor, no EO 13873 action, no machine exam or seizure found (searched by name) (R). (R, Florida''s Voice, The Defiant, CNN, Nov 16-17): the router believed to be behind the ground stop is at an L3Harris lab in Florida with FAA staff and FBI agents on site; Duffy says he called Kash Patel himself to "send your agents." The FBI says it is helping, not seizing anything (CNN had reported agents "took possession"). CNN: "there is no evidence that the router involved in the FAA incident was compromised," and it recalls Chinese backdoors found in Juniper routers. The FAA paused Juniper router installations (R, CNN, WSJ, PBS). <em>Sequence:</em> infrastructure hardware, an old Chinese-implant story and the FBI in the room is the shape DHS''s Aug 24 letter gave voting machines ("If a component is tampered with during manufacturing, it could serve as a point-of-entry for hackers") {P}.
      (D, ECF 73, Nov 14): plaintiffs'' response to the motion to dismiss says the injury is not "potential foreign actor and AI-assisted third-party interference" but unequal treatment; again quotes Mullin''s Aug 24 letter ("election security is national security"; parts "manufactured by foreign adversaries introduce significant security risks"); says "DHS and FEMA have conditioned federal grant funds on a post-election manual audit of at least five percent of paper ballots"; the claims "challenge the procedure for counting and certifying in the face of vulnerabilities federal reviewers have found." <em>Sequence:</em> dropping the foreign-interference injury keeps the suit alive on equal protection while the DHS letter stays in as the factual premise, now called what "federal reviewers have found" {P}. Phrase score 11. (D, Potter County Republican Party v. Benge, N.D. Tex. 2:26-cv-00215-Z, ECF 72, First Amended Class Action Complaint, Nov 14): adds a plaintiff (Alexander Hale), CISA''s
      plan, reconciliation gaps and "corrected to match" relief to a suit that since Oct 27 has sought a defendant class of every Texas county election official and a pre-certification hand count (the Aug 24 and Sept 2 Mullin letters, "Election security is national security" and the router determination were already in the original); asks that "before final certification" all lawful paper ballots in the Nov 3 federal races be hand counted and results "corrected to match the hand count where they differ," plus "a manual hand count ... in all precincts in Texas" and preservation of ballots, ballot images, cast vote records and chain-of-custody records. Opening line: "Election security is national security." It quotes Mullin''s Aug 24 letter (China-made parts, "synchronized attacks"), Mullin''s Sept 2 letter to Blanche (QR and barcode ballots "may not be suitable for voter verification or manual audits," HAVA, EO 14248), CISA''s 2026 plan "Securing the Next 250" (manual audits "before certifying"),
      and the Mar 20 router "National Security Determination." Potter County''s statutory audit is Nov 16; the county''s reply is due Nov 17; Kacsmaryk allowed no extensions. <em>Sequence:</em> the federal predicate text has been in this court through a private party since Oct 27, in the same package (Aug 24 letter, Sept 2 letter, CISA plan) the Georgia State Election Board used in September. A machine challenge to certification no longer waits for a federal finding; it borrows DHS''s words, and a ruling for plaintiffs would put a federal judge in charge of Texas''s certification timeline {P}. Benign: Texas already requires partial hand audits; the suit frames it as uniform standards. No press coverage of the amended complaint found yet (searched). New, documents in hand (D, Georgia State Election Board resolution Sept 28 and Executive Director James Mills''s letters to Mullin and Blanche, Sept 30): the board says "the Federal government has deemed the voting systems to be ''critical infrastructure''
      and the Dominion systems are ''protected computers'' within the meaning of 18 U.S.C. § 1030(e) such that the knowing transmission of information over a Dominion system that is compromised could impair the integrity of data," and resolves that copies of the county server and scanner hard drives "be provided to the State Election Board, DHS and the US Department of Justice (DOJ) ... for examination, review, or investigation." The letters ask DOJ to "preserve all such records under federal supervision" and cite a DHS-DOJ "letter of September 2, 2026" on QR-code ballots and ERIC/CEIR data sharing. <em>Sequence:</em> the machine claim does not need a federal finding to start: a state body has already supplied "critical infrastructure," "compromised" and the federal computer-crime statute, the words that make a machine problem an FBI matter, and invited DHS and DOJ to take the drive images {P}. A viral claim that "The FBI in coordination with the Department of Homeland Security is currently
      seizing vote counting machines in Texas and Arizona" is false (R, Lead Stories, Nov 9: the photo is the AP image of the Jan 28 Fulton raid; the source page is listed as a comedian); it was repeated in American Thinker (R). The fake post says the seized machines put "the full registration lists into the hands of federal investigators" so "ICE can locate the individuals who registered." <em>Sequence:</em> the satire narrates the voter-data-to-ICE route; watch for anyone official repeating it {P}. Hand counts in the news are routine audits (Kansas, Iowa, Arkansas, Marin, San Diego) (R). <em>Sequence:</em> the seizure story is circulating without any official act; watch for an official repeating it {P}. (R, Democracy Docket, Nov 10): Trump''s Nov 9 post "resurrected old conspiracy theories about voting machines, suggesting they were rigged to help Democrats win" ("It''s all about the machines"). <em>Sequence:</em> the claim is now the president''s, aimed at the whole result; nothing official
      has adopted it {P}. Added Nov 10 as its own row (it was scattered across rows 1, 3 and 9). Latest (R, Nov 9): Trump: "It''s all about the machines, which are far more important than the voter!" (row 9). DHS (D, Aug 24 letter, released Aug 26): Secretary Mullin wrote the White House Transparency Task Force that machines with China-made parts "introduce significant security risks," that ES&amp;S, Hart and Dominion (over 80% of the market) "acknowledged that their voting machines have parts made in China," and that tampered parts could allow "synchronized attacks across multiple machines and jurisdictions"; he cited vendors'' 2020 testimony and 2024 intelligence documents, not any exploitation, and tied full DHS grants to "random post-election manual counts of paper ballots." DHS threatened to hold back 20% of counterterrorism grants over the conditions; a judge struck them down in September (R, Votebeat). Post-election review (R, Nextgov Oct 28): Mullin plans a post-election "debrief"
      to weigh changes to voting systems; no date or scope. Commerce route (R/D): Cleta Mitchell and Tina Peters urged Commerce Secretary Lutnick to use regulatory authority over voting machines; the phrase "impose mitigation or prohibition" is from Peters'' writing; Ed Martin described Peters'' White House meeting on his show (R, Democracy Docket, Oct 6, corrected: https://www.democracydocket.com/news-alerts/election-deniers-cleta-mitchell-and-tina-peters-want-trumps-commerce-secretary-to-regulate-voting-machines/). That the route runs through the 2019 supply-chain emergency (EO 13873) is our reading of the authority they point to {P}; released emails show White House-linked proposals to use Commerce authority against machines (D, American Oversight). Machines already taken or sought (R): an Olsen-led ODNI-DOJ-DHS-FBI team examined a Puerto Rico machine for foreign manipulation and found nothing; Miller pushed to bring in the FBI and seize more machines (Reuters, Oct 2); DHS appointees
