  - date: Nov 11
    source: Mississippi Free Press
    html: 'Hinds County accepted 817 and rejected 1,609 affidavit ballots (about 66% rejected); by district, D5 (Jackson State) 181 accepted, 482 rejected. A commissioner blamed registration-drive forms not filed by the deadline. Watson (D, X post, Nov 9): 15,547 affidavits processed statewide, "roughly 76%" accepted. Colom won anyway (row 9). <em>Sequence:</em> how many rejected affidavit voters were inactivated through the Experian process is still unreported; that number is the 2028 evidence {P}. {R}'
    checked: false
  - date: Nov 10
    source: Democracy Docket
    html: Watson posted, then deleted within 30 minutes, guidance telling voters to use a mail-ballot signature "cure" process he repealed in August; the outdated guidance remains on the SoS website. Mail and ID-cure deadlines passed 5 p.m. Nov 10; inactivated voters' affidavit ballots are still being reviewed by county commissioners (R). {R}
    checked: false
  - date: Nov 9
    source: DOJ release 26-1334
    html: Attorney General Blanche came to Jackson City Hall, across from the Hinds County Courthouse where affidavit voters had to cure by 5 p.m. Tuesday, with Gov. Reeves, AG Fitch and U.S. Marshals Director Serralta, to award Jackson more than $63 million under DOJ's Model Cities Initiative, including a "Sky-to-Street Public Safety Network utilizing unmanned aircraft systems." The release does not mention the election. Demonstrators said the visit, with a large police escort, could deter voters from curing (R, Democracy Docket, Nov 9). {D}
    checked: false
  - date: Nov 9
    source: Democracy Docket, SuperTalk interview
    html: 'Watson defends the Experian-based inactivations: "The system at the end of the day… is working as it was designed"; "I stand behind and will not apologize for having clean voter rolls"; "I cannot make an election commissioner do his or her job." Rankin County commissioner Tonya Rivers says the state''s data was inaccurate. Monitors say they were shut out of some county affidavit counts; the ACLU reports closed-door counting (R, Capital B, Nov 7-9). Colom leads by about 2,500; cure deadline 5 p.m. Nov 10; counties certify Nov 13. <em>Sequence:</em> the nation''s top prosecutor appears, with the two state officials who run the roll purge and DOJ''s state fraud task force, in Colom''s home base during the cure window; the grant is unrelated on paper, but presence is what voters see, and the official who ran the purge now calls the result the design {P}. {R}'
    checked: false
  - date: Nov 6
    source: Mississippi Free Press and CBS
    html: rejection runs up to half of affidavit ballots in some counties (Chickasaw 48.5%, Benton 43.1%, Itawamba 34%, Alcorn 26.7%); Rankin's rejections are just over half for wrong precinct; Watson says about 80% accepted statewide. <em>Sequence:</em> no county reports how many rejected affidavit voters were inactivated through the Experian process, which is the number that ties the loss to the federally piloted data {P}. {R}
    checked: false
  - date: Nov 6
    source: Democracy Docket
    html: 'Watson''s office adopted a temporary rule in mid-August deleting the state''s mail-ballot cure provision (Title 1, Part 17, Chapter 4, added after a 2020 suit); a spokesperson confirms "no steps for curing a mail-in." Affidavit counts (R, Mississippi Free Press): 6,936 processed statewide by Thursday; Rankin about 20% rejected so far; an ACLU letter says DeSoto is not giving full public access to the affidavit count. <em>Sequence:</em> inactivated voters were pushed to affidavit ballots, and mail voters now have no cure; both cuts land in the closest Senate race {P}. {R}'
    checked: false
  - date: Nov 5
    source: ''
    html: 'up to ~18,000 affidavit ballots statewide still to be cured (unconfirmed), against a 1,138-vote margin; the Hyde-Smith campaign demands they be segregated and preserved for a possible contest (D; row 9). Mississippi (R/D): Secretary of State Michael Watson paid Experian $50,000 (contract Dec 2024) for its TrueTrace "Best Address" locator and ran about 1.9 million voter checks; the contract says Experian "cannot and will not ... be an insurer or guarantor of the accuracy or reliability" of its data, and Experian told the EAC "we don''t verify residency" (R, Mississippi Today). Rolled out to all 82 counties July 2025 as "reliable commercial data" (R). Federal hand (D): the U.S. Election Assistance Commission paid for the Experian pilot that included Mississippi and Lafayette County (EAC study, Aug 2025). Result: at least 50,000 inactive by the March primary, with notices mailed to the unverified Experian addresses (R, Mar 25); over 230,000 inactive, about 1 in 9, before Nov 3, up
      to 1 in 5 in DeSoto and Wilkinson (R, Nov 2). Under state law an inactive voter "shall be unable to cast a regular ballot" and must vote by affidavit; missing two federal general elections means purge (D, Miss. Code 23-15-152). The office says it has since swapped Experian for IDI Data (R). Watson: "Voter roll maintenance is the cornerstone of election integrity" (R, Nov 3). Now (R, Nov 4-5): Colom leads by about 1,138 (AP, 96%; earlier counts had it at 43-65); Watson: about 3,600 mail ballots plus an "unknown" number of affidavit ballots; affidavit voters must show ID "within five business days"; counties certify Nov 13, state Dec 3; no recount law, so any fight goes to court. DeSoto (up to 1 in 5 inactive) reported late openings, ballot shortages and two-hour waits; the Democratic Party''s emergency suit was filed and dropped (CI2026-691). The complaint (D, ¶18): "Lewisburg and Twin Lakes Baptist precincts ran out of affidavit ballot envelopes, prohibiting the ability for voters
      to complete an affidavit ballot." <em>Sequence:</em> for an inactivated voter the affidavit ballot is the only ballot, so no envelope meant no vote {P}. Compliant-state ties: Mississippi gave DOJ its full voter list with driver''s license and Social Security numbers but refused DOJ''s MOU (R, Brennan tracker; D, Watson letter Dec 9, 2025); its new SHIELD Act requires yearly SAVE citizenship checks (R); DOJ funds its AG''s Joint Task Force Vigilance (D, row 15); Watson and AG Fitch both sit in DOJ''s Southeast Regional Fraud Enforcement Partnership (Jul 31), run by the fraud division whose head attended the Vance fraud task force''s first meeting, and Fitch and Gov. Reeves signed Vance''s fraud pledge (D/R). Whether DOJ or DHS sent Mississippi any list, or whether SAVE checks ran before Nov 3, is not public (U). <em>Sequence:</em> no federal list was needed here; a cooperating state, using federally piloted commercial data, moved a ninth of its voters to a status that costs them a regular
      ballot in the closest Senate race of the year {P}. {R}'
