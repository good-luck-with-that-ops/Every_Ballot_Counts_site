    html: 'OMB''s "legally binding" apportionment footnotes required HUD Continuum of Care money to go only to awards with terms consistent with EO 14332 and EO 14321, under Antideficiency Act penalties; "OMB reissued the footnotes in its fiscal year 2027 apportionment"; Judge McElroy vacated them: "The Court is not prepared to create this loophole." <em>Meaning {P}:</em> apportionment used as a policy lever without Congress, re-imposed each year until a court stops it (row 27). (D, National Urban League v. Trump, D.D.C. 1:26-cv-03401, ECF 23): a Sept 25 rescission message froze "roughly $56 million" in HUD housing-counseling funds that expired Sept 30; the court paused the deadline; the hearing is Nov 24. (R, HuffPost, Nov 19): Republican doubts on Ueland: Tillis, "Not a fan"; Collins, "I don''t know if he''s a bipartisan pick"; Kennedy, "I understand the concern … that he might be too partisan"; Murray (D): confirming him would be "lunacy." CREW and former watchdogs via POGO urge rejection
      (R, headlines). Hearing today (row 23). (R, IBTimes from documents, Nov 14): a leaked State Department report proposes $888 million for a U.S.-focused global-health "innovation fund" (from $60 million), zeroes health aid for eight countries, and plans to withhold or redirect about $605 million of the $607.5 million Congress approved for family planning; Rubio authorized up to $125 million to be redirected to energy security on Sept 25. (D, State Dept Delegation of Authority 635, signed Sept 16, publishes Nov 18, FR 2026-23462): NED''s audits, FOIA compliance, grant administration and the statutory pre-program consultation all go to the Under Secretary for Public Diplomacy; "The Department will therefore not view NED''s consultation responsibility as having been satisfied by any communications that do not include the Under Secretary." <em>Sequence:</em> a congressionally funded, independent grantee now answers to one political office for money, records and sign-off {P}. (R, Politico
      via Yahoo, Washington Sun, Nov 16): Trump nominated Eric Ueland, OMB deputy director for management under Russ Vought, as Comptroller General; Sen. Rand Paul set the HSGAC hearing for Thursday Nov 19 after giving the statutory commission "less than 24 hours" and never convening it; GAO "has issued more than a half-dozen findings of illegal impoundment of federal dollars since the start of Trump''s second term. But so far, GAO has not taken legal action." <em>Sequence:</em> the one body the Supreme Court has suggested can sue over impoundment would be led for 15 years by the deputy of the official whose withholdings it found illegal; a lame-duck vote puts it out of the new Congress''s reach {P}. (D, CMS "CRUSH" proposed rule, FR 2026-23461, publishes Nov 19, 60-day comments): a fraud determination by "CMS or another Federal agency" becomes a "credible allegation of fraud" for state payment suspensions, and the phrase "which has been verified by the State" is dropped; quarterly reporting
      for "closer-to-real-time data and analytics"; a new beneficiary eligibility audit program and "Eligibility-Related Disallowances"; it cites EO 14395 (the Vance fraud task force) and "significant State noncompliance," and recalls the Secretary''s power "to withhold Federal payment to a State." <em>Sequence:</em> the week Vance''s task force was pointed at "Democrat run Cities and States" (row 21), HHS proposed the payment lever for it; whoever runs the federal match decides which providers and states lose money {P}. (D rule; R headlines, Nov 16): Commerce''s BIS interim final rule on remote access to "Super Intelligence (SI)" chips exempts U.S.-headquartered buyers and social-media "commercial recommender systems" and lets the Secretary add countries; the same day the Washington Post reported "Trump''s stake in Nvidia grew to as much as $62 million before scandal broke out," CBS reported ex-employees describing "chaos" and inaction on alleged chip smuggling in Lutnick''s department,
      and Trump said he will not fire Lutnick (R, Politico). <em>Watch:</em> the Ueland hearing (Nov 19) and any GAO impoundment decision withdrawn or delayed; CRUSH comments and whether "another Federal agency" includes DOJ''s fraud division or the Vance task force; the full Washington Post and CBS reporting on Lutnick and Nvidia {P}. {D}'
