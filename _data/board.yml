    html: 'banks would keep "the authority ... to obtain additional information," including whether customers'' beneficial owners "possess lawful immigration status and employment authorization," as directed by EO 14406 (May 19); comments due Jan 19, 2027. <em>Sequence:</em> in one week the fraud machinery reached contractors through a two-database match and banks through a rule, with no new law {P}. (R, NBC, Nov 12; D, OGE 278e via ProPublica): Tony Salisbury, Miller''s deputy, is now Homeland Security Advisor; his 2025 disclosure lists him as "Executive Associate Director, Department of Homeland Security," HSI''s top job. NBC: he "often ensured that the Department of Homeland Security was carrying out Miller''s ideas." The Homeland Security Advisor is the fraud task force''s named "Senior Advisor" (D, EO 14395 sec. 2(b)) and coordinates the EO 14390 cybercrime plan and its National Coordination Center (D). <em>Sequence:</em> the man who ran HSI, the agency behind the voter-list leads and
      the Minnesota surveillance of organizers and churches, now sits over the fraud task force aimed at Democratic-led states {P}. Vance''s task force announced $42 million in SNAP fraud and a Texas fraud task force launched (R, headlines). (R, NYT, Nov 17): IRS agents analyzed nonprofits'' Form 990s for the FBI and discussed an expedited audit to revoke tax-exempt status from groups whose leaders are indicted (row 18). <em>Sequence:</em> the Form 990 Transparency Initiative (Apr 23) and the IRS-CI terrorism detail meet at the nonprofit tax return {P}. (D, IRS-CI releases, Nov 5 and 13): Delaware''s Program Fraud Task Force is "part of a nationwide initiative" that "supports President Trump''s Task Force to Eliminate Fraud," with the Fraud Division and state police; Eastern North Carolina''s TF2 covers "benefits, housing, disaster relief" and warns "We will find you, we will prosecute you," the DHS general counsel''s Oct 31 line to noncitizen voters. North Carolina''s state auditor signed
      the Vance fraud pledge (R, headline). (D, Treasury and FinCEN releases, Oct 30): framed "As part of the White House Task Force to Eliminate Fraud," FinCEN issued an "Alert on Risks Associated with Foreign-Agent-Directed Transactions" and a "Notice on the Use of Charities and Non-Profit Organizations for Illicit Activity"; Treasury says banks reported "more than $8 billion in potentially suspicious wire payments ... at the direction of foreign agents" from 2021 to 2025. FinCEN notes suspicious-activity reports "provide investigative leads and do not establish criminal wrongdoing" (R). (D, Treasury release, Apr 23): the "Form 990 Transparency Initiative to Expose Hidden Funding" will revise the nonprofit tax return to add government contracts, grants and fiscal sponsorship, "to detect misconduct and hold wrongdoers accountable." Bessent: "We are ending the days of hiding fraud, abuse, and extremist activity behind complicated nonprofit arrangements." (D, IRS draft 2026 Form 1040, Sept
      18): for the first time page one asks whether each filer is "a U.S. citizen, U.S. national, or an alien lawfully authorized to work in the U.S."; Senate Democrats say the IRS "does not need this checkbox to collect taxes" (R). (D, CMS "CRUSH" proposed rule, publishes Nov 19): a fraud finding by "CMS or another Federal agency" can trigger a state''s cutoff of provider payments, without the old words "which has been verified by the State"; it cites EO 14395 and "significant State noncompliance." (R, NPR, Nov 13): Trump moved the Vice President, who chairs the fraud task force, to "the Massive Corruption and Crime taking place in Democrat run Cities and States," naming Minnesota, California and Illinois. (D, EO 14395 sec. 2(b)): the task force''s Senior Advisor is the Assistant to the President for Homeland Security, and the chair may add "other agencies, inspectors general, or components within the Executive Office of the President." <em>Sequence:</em> the same task force now reaches
      bank reporting, the nonprofit tax return and Medicaid payments, and it has been pointed at Democratic-led states; the NSPM-7 "domestic terrorism" frame for organizers (row 18) and this "fraud" frame meet at the nonprofits that fund and run civic work {P}. Phrase trail: "hidden funding," "extremist activity," "foreign-agent-directed." <em>Watch:</em> the first suspicious-activity referrals or account closures hitting nonprofits; the revised Form 990; the first CRUSH payment cutoff against a Democratic-led state. {D}'
