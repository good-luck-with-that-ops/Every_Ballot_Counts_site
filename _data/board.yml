since:
- DHS and FEMA asked an appeals court to restore their power to withhold security grant money from states that would not check every voter against SAVE and plan a move to hand-marked paper ballots, arguing FEMA may act on "potential threats from hostile actors". <em>Meaning [P]:</em> the election conditions a judge struck down in September are still the government's goal, and the stated ground is the same foreign-threat premise the emergency hinge needs. Rows 20, 22. {D}
- The White House said the National Cyber Director's office "will be integrated into a reorganized White House operational and policy structure" under the National Security Council and Homeland Security Council, and that CISA "waived otherwise applicable limits on its hiring". <em>Meaning [P]:</em> the office the law says DHS must consult before declaring a "significant incident" is being folded into White House staff, with the intelligence director acting in it. It also says DOJ and the FBI will announce a new cyber initiative next week. Row 3. {D}
- The Justice Department's Civil Rights Division, under acting chief Craig Trainor, filed a brief backing Ohio's rule that people registering to vote at the DMV must show citizenship documents. Row 20. {D}
- Attorney General Blanche ordered lawyers across DOJ's civil divisions, Civil Rights included, to help fight more than 97,000 detainee habeas petitions; the same week a former ICE attorney who ordered Mahmoud Khalil deported was named acting head of the immigration courts. An appeals court also let Bill Essayli keep running the Los Angeles U.S. Attorney's office while the Supreme Court takes up the Nevada case (R). Rows 6, 27. {R}
- A pro se suit asks a federal judge to pause Pennsylvania's certification of the PA-5 House race over Hart machine checks and seeks the state voter file, citing "2,865,011 flagged conditions"; DOJ's Voting Section was copied on the demand. Patrick Byrne claimed a Michigan town's election equipment talked to "Shenzhen, China"; the claim's own author traced the signal to a TV's HDMI adapter (R, <a href="https://hoax-alert.leadstories.com/2026/11/fact-check-wifi-signal-martin-township-michigan-renkchip-tabulator.html">Lead Stories</a>). Rows 9, 17. {D}
- About $300 million of unnamed money reached a Park Service account the President uses for his building projects in September; the Park Service plans a "realignment" the week of Dec 7, before the new Congress (R, <a href="https://www.motherjones.com/politics/2026/11/trump-interior-burgum-national-park-service-overhaul-congress-rush-election/">Mother Jones</a>). Rows 22, 24. {R}
