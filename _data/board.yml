    html: 'the fraud task force flagged 1,579 federal contractors holding over $53 billion in contracts. The DHS Secretary and GSA Administrator wrote: "By matching up E-Verify and SAM data, we identified a set of contractors that may potentially not be in compliance"; firms have 30 days, then letters of concern and possible cancellation, suspension or debarment. Mullin: "For too long, federal contractors have been raking in billions of dollars with too little scrutiny. That ends now." The list is not public. {D}'
