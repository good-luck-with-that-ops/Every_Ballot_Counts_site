    html: 'the Ninth Circuit granted DOJ''s own motion to dismiss its appeal in U.S. v. California (No. 26-7231); the state and intervenors reserved costs and fees. <em>Meaning {P}:</em> the civil route to set California ballots aside is closed; the criminal route (row 2) is what is left. (D, ECF 24 now public, Nov 16): the plaintiffs withdrew only the preliminary-injunction part of their motion because "Defendants represent to the Court that... Defendants have refrained from the conduct the temporary restraining order restrains related to the November 3, 2026 election and that Defendants will not resume that conduct before Washington certifies the election results on December 3, 2026"; the withdrawal is "without prejudice and is conditioned on the continued accuracy of Defendants'' representations." The Nov 18 hearing is stricken; the TRO lapses about Nov 19. <em>Sequence:</em> every DOJ stand-down this cycle is dated to certification (California "evaluating," Alaska on appeal, Washington
      Dec 3); nothing binds DOJ after it, which points the next move at contests, seating and the 2028 rolls {P}. (Replaces the Nov 16 midday line that the filing was not yet public,) (D, Nov 10): the California case is closed (ECF 181); the court found the suit "attempted to disrupt an ongoing election." No new set-aside demand found Nov 10-11 (checked). (D, ECF 180 read; R, Democracy Docket and The Hill, Nov 6-7): DOJ filed a notice of voluntary dismissal in U.S. v. California (C.D. Cal. 2:26-cv-12025) before any merits ruling. The notice: "There is then no way to get the challenged ballots segregated" and "The United States is evaluating how to best ensure that American votes are protected." No next step named; the Nov 13 hearing with the special master falls away. <em>Sequence:</em> the court route to hold California ballots is closed by DOJ itself; "evaluating" points to the criminal route (row 2) or to action after certification, not to a new civil demand {P}. (D, OneAmerica Votes
      v. Trump, W.D. Wash. 2:26-cv-04223-JNW, ECF 21, Nov 5): Judge Whitehead''s 14-day TRO bars DOJ and DHS from demanding that Washington officials remove listed voters, refuse them ballots, or segregate or not tabulate their ballots: "DOJ may not demand that election officials set aside a registered voter''s ballot because the voter''s name appears on a federal list." Carve-outs: investigating or prosecuting voters, sharing information, "stating its view of what federal law requires." Stay pending appeal denied; PI hearing Nov 18. <em>Sequence:</em> Washington, the one state besides California that got a formal demand, is now covered; the en banc Ninth Circuit stay of Thompson''s order is the obvious appeal argument {P}. (R, Nov 3): with Thompson''s order stayed by the en banc Ninth Circuit (6-5), DOJ may again ask officials outside California''s Boasberg injunction to set aside listed voters'' ballots while citizenship is checked; states need not comply. (R, TPM Nov 3): Boasberg ruled
      the DSCC v. Trump plaintiffs lack standing: "Even extraordinary merits questions cannot justify the extraordinary relief." The California protection now rests on CHIRLA v. DHS (Boasberg), LWV v. DHS (Chutkan) and Thompson''s order. Supreme Court denied DOJ''s emergency application Nov 2 evening, hours after filing; no noted dissents (R, NPR/KPBS; CNN; WaPo; TPM). Same night, Chief Judge Boasberg (D, CHIRLA v. DHS, D.D.C. 1:26-cv-03072, ECF 48) enjoined DOJ and DHS from demands to California officials "seeking to compel the segregation of ballots, or other deviations from existing state elections procedures, based on voters'' inclusion on the lists of suspected non-citizens"; likely Elections Clause violation; 18 U.S.C. 611(a) "does not regulate the time, place, or manner of elections." (R, Democracy Docket Nov 2): in DSCC v. Trump, DOJ argued its letters have no force "absent the intervention of a federal court." Alaska dismissed (D, Nov 1, ECF 79-81): Judge Gleason held the court
      "lacks the authority to order that certain ballots cast by Alaskans be segregated so that federal law enforcement officials can conduct an unspecified investigation of the voters who cast them"; DOJ appealed the same day, seeking to revive a bar on certifying "any result that may be impacted by voter confusion"; no emergency motion yet (R, TPM). Washington letter (D, Oct 26): officials asked to "not verify the signature and/or tabulate the ballot until citizenship can be determined"; "emergency relief" threatened. No suit filed (R). Ninth Circuit, Oct 30, 2-1, denied DOJ''s injunction pending appeal on the California ballots (R): "there is no feasible way to identify and segregate the ballots of specific individuals." Carter (C.D. Cal.) denied DOJ''s TRO Oct 28 (D, ECF 149): "these threats must stop"; special master Garrie (the Nov 13 hearing fell away when DOJ dismissed the suit Nov 6) (D). LA County certifies Dec 3, state Dec 11 (D). {D}'
    source: <a href="https://www.courtlistener.com/docket/74967108/183/united-states-v-state-of-california/">9th Cir. order</a>, filed Nov 18, docketed
