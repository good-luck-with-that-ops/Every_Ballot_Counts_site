    html: 'the FCC is creating a "Foreign Adversary Risk Management System" recording whether licensees are under "the control or other influence of a foreign adversary or adversarial country," with status "made public" and information "made available to national security and other relevant law enforcement partners." (R, <a href="https://www.nytimes.com/2026/11/24/us/politics/spy-agencies-computer-network-breaches.html">NYT</a>, Nov 24): the breached CIA/ODNI open-source system is one where "Information at other government agencies was also believed to have been exposed"; such systems can include "information sold by data vendors that can be highly revealing, especially when combined with other tranches of data." <em>Meaning {P}:</em> a shared intelligence platform holding purchased data, possibly on Americans, joined to other agencies'' information. Who supplies the data and which agencies reach the system are open. {D} Login.gov''s "Secure Token Exchange" lets America.gov act for a signed-in
      person at an agency, and a "Proofing Agent" API lets SSA agents submit a person''s email and SSN. {D} FS3 fraud-flag sharing across IRS, SSA, SBA and HUD on a GSA-held key. {D} the Homeland Security Task Force''s National Coordination Center runs a program authorizing "Participating Companies... to conduct Cyber Surveillance Operations and Cyber Effects Operations," with targets identified to them by "Federal, State, local, tribal, and territorial agencies"; procedures must cover activity "directed at a United States person" with "any necessary authorization, judicial or otherwise"; the workflow is in a classified annex. <em>Meaning {P}:</em> the Threat Disruption Center with TRM Labs sits in that same center. {D} reissued with the law''s extension "through December 11, 2026"; companies may share cyber threat indicators "notwithstanding any other provision of law," including with law enforcement in some cases. <em>Meaning {P}:</em> the private-to-government sharing channel the White
      House credits for the outage fixes lapses in 19 days unless the lame-duck Congress acts. {D}'
    source: <a href="https://public-inspection.federalregister.gov/2026-24041.pdf">FCC system-of-records notice FR Doc. 2026-24041</a>, publishing
