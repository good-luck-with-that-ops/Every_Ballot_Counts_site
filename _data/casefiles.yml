  written_html:
    What's going on: '<p>This is the direct route. It doesn''t need an emergency. It puts pressure on everyone between a voter and a certified result.</p>

      <p>Start with the people who count. Before the election, DOJ told election officials in all 50 states to preserve their records for 22 months, ballots included. {R} Afterward the pressure moved to grand juries: federal prosecutors in California subpoenaed county election chiefs for records of how they answered DOJ''s demand to confirm citizenship or set aside the ballots of "suspected aliens." {R} DOJ''s acting Voting Section chief told New Hampshire''s Secretary of State in September that he is under criminal investigation for refusing to hand over the unredacted voter list. {R} A federal judge in Washington barred DOJ and DHS from demanding that officials set aside the ballots of voters on a federal list: "A threat of prosecution made for that purpose is not legal advice. It is the pressure that makes the demand work." {D}</p>

      <p>Then the ballots themselves. The FBI seized Fulton County''s 2020 election records in January. In November two FBI agents and two federal prosecutors, one of them Dan Bishop, the U.S. attorney named to prosecute election fraud nationwide, questioned the county''s 2020 elections director for more than two hours. {R} On Nov 24 a Georgia judge ordered copies of the seized records handed to the State Election Board. The next day she halted her own order while the county appeals. {R}</p>

      <p>Voters got their share. Before the election, armed DHS agents went door to door doing "field reviews" in at least six states, and video shows agents holding a "Target List." {R} America.gov hosts a DHS "Report voter fraud" form that asks people to "Name the person you''re reporting," with up to $1,000,000 on arrest and conviction. {D} The case that limited DHS election field operations in nine states was dismissed on Nov 18. {D}</p>

      <p>So did candidates and the people who won. FBI agents served an Alaska candidate with a grand-jury subpoena, signed by a Civil Rights Division leader in Washington, for records on Mary Peltola''s campaign, the Elias Law Group and several PACs. {R} Records unsealed Nov 23 show DOJ telling a court that "ILHAN has committed [REDACTED] crimes over decades" when it sought to search a sitting member''s home. {R} Politico reports the White House and DOJ are threatening incoming House Oversight chair Robert Garcia and Sen. Adam Schiff with the federal "conspiracy against rights" statute. {R}</p>

      <p>After the vote come the results. The suits to stop or undo certification keep coming, and so far they keep losing. The Texas suit to hold certification until the federal races were hand counted was dismissed on Nov 24. {D} Two Georgia House Republicans are asking state courts to void their losses. {R} A pro se suit asks a federal judge to pause Pennsylvania''s PA-5 certification over Hart machine checks, and DOJ''s Voting Section was copied on the demand. {D}</p>'
    What we presume: <ul><li>{P} Each time a court stopped a civil demand, the criminal route stayed open, so the pressure on the people who count outlasts the election.</li><li>{P} Nothing now limits DHS election field operations going into 2028, and the people DOJ is threatening are the ones who will hold subpoena power after Jan 3.</li><li>{P} This route doesn't have to win in court. It works if officials, voters and candidates decide a fight with the federal government isn't worth it.</li></ul>
