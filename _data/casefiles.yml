    status: armed
    html: 'Treasury''s Financial Crimes Enforcement Network is "investigating a cybersecurity incident that resulted in unauthorized access to a limited subset of its systems" and "has taken some systems offline"; no actor named. The fourth federal intrusion reported in about a week (FBI crime database, USDA, CIA/ODNI, FinCEN). <em>Meaning {P}:</em> attribution is still open on all four, which keeps a foreign-blame announcement available on the government''s timing. (R, <a href="https://www.nytimes.com/2026/11/24/us/politics/spy-agencies-computer-network-breaches.html">NYT</a>, Nov 24): the CIA and ODNI found a breach of "an open-source intelligence analysis system"; "it appears that a hacker gained unauthorized access to at least one government system," and the people briefed "did not say whether investigators knew who was responsible." Fox: an FBI source says it came the same day as the NCIC hit (R). <em>Meaning {P}:</em> three intrusions in a week (NCIC, USDA, CIA/ODNI) and none attributed.
      Clayton''s "not state sponsored" so far covers the outages only; the official who would name a country has now had his own office breached. Watch which word he uses for the breaches. {R}'
    source: <a href="https://abcnews.com/US/treasurys-fincen-cybersecurity-incident-includes-unauthorized-access-systems/story?id=138432822">ABC</a>, <a href="https://www.newsweek.com/treasury-financial-crime-unit-cyber-incident-fincen-12766120">Newsweek</a>
  - date: '2026-11-24'
    label: Nov 24
    tw: 3
    tw_name: Emergency declaration
    status: armed
    html: 'FinCEN confirms "unauthorized access to a limited subset of its systems" and took systems offline; its batch filing had been down since about Nov 18 (R, The Deep Dive), during the outages the DNI called patching, not a cyberattack (Nov 17). <em>Meaning {P}:</em> four intrusions, one of them in the system that holds banks'' suspicious activity reports, and still no emergency directive or public "major incident" notice; the incident record is being built outside the public channels the statute uses. Mullin, last 36 hours (DHS releases): "We will never apologize for enforcing our nation''s laws and getting public safety threats off our streets" (Nov 24); on New York: "If Governor Kathy Hochul and Mayor Zohran Mamdani really care about the safety of New Yorkers, they will put an end to these reckless sanctuary policies" (Nov 24); on Abrego Garcia: "Now, this El Salvadoran man cannot terrorize innocent Americans" (Nov 24) (D). The pending bill for this row is still the ROOT CAUSE Act.
      (R, <a href="https://www.nytimes.com/2026/11/24/us/politics/spy-agencies-computer-network-breaches.html">NYT</a>, Nov 24): the CIA and ODNI found a breach that exposed unclassified information on an open-source intelligence system, with other agencies'' information "also believed to have been exposed"; an ODNI official says there were "no disruptions to critical capabilities"; no attribution. <em>Meaning {P}:</em> the DNI is also acting National Cyber Director, the official the DHS Secretary must consult before a "significant incident" declaration (6 U.S.C. 677b); his own office is now an affected agency. A breach exposing several agencies'' data is the kind that brings a FISMA "major incident" notice to Congress within 7 days; none reported for this one or for NCIC. Clayton on NCIC (R, NYT, quoting ABC, Nov 22): "they have an incident. They''re dealing with it in the ordinary course." {R}'
    source: <a href="https://abcnews.com/US/treasurys-fincen-cybersecurity-incident-includes-unauthorized-access-systems/story?id=138432822">ABC</a>
