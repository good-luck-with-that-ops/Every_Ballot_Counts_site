    html: 'Byrne: "a Michigan town''s election equipment contained a secret (illegal) WiFi device communicating with Shenzhen, China"; Colbeck, whose brief for Lindell''s Election Crime Bureau it rested on, says the signal was "definitively traced to a TV''s HDMI adapter." {R}'
