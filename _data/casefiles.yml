    status: armed
    html: 'still no U.S. agency attribution of any current incident to a foreign country; Bloomberg: "Iran Hit Key Infrastructure, Isn''t Behind Tech Outages, US Says" (R, headline). The public "Iran did it" claim comes from commentary: a former intelligence officer on LBC said "I think the Trump administration is not being honest by the way, about who is behind these attacks" (R, <a href="https://www.express.co.uk/news/world/2267083/iran-behind-us-tech-outages">Daily Express</a>, Nov 17). New, the one confirmed attack of the week (D, <a href="https://status.optimizely.com/incidents/ftw0fh9wx43z">Optimizely</a>): "On 16 November 2026, an unauthorized third party exploited a flaw in the Optimizely Web Experimentation account signup flow," impersonated users and inserted malicious scripts into customer projects. Researchers found the code on 178 organizations'' sites (banks, airlines, CNN, BBC, Fox News, Equifax), serving a card skimmer and the Coruna and DarkSword iPhone exploit kits, which
      Google earlier tied to spyware vendors and a suspected Russian espionage group; no attribution, no government site named (R, <a href="https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/">Report URI</a>, <a href="https://krebsonsecurity.com/2026/11/attackers-used-optimizely-to-a-b-test-malware-on-top-websites/">Krebs</a>).'
  - date: '2026-11-19'
    label: Nov 19
    tw: 1
    tw_name: Foreign blame for a current hack
    status: armed
    html: two former L3Harris employees say the Coruna iPhone kit in the Optimizely attack was "at least in part" built by Trenchant, L3Harris's hacking-tools unit ("Coruna was definitely an internal name of a component") (R, <a href="https://techcrunch.com/2026/03/10/us-military-contractor-likely-built-iphone-hacking-tools-used-by-russian-spies-in-ukraine/">TechCrunch</a>, Mar 10). Trenchant's former general manager admitted selling eight tools made "exclusively" for the U.S. government and allies to a Russian broker from 2022 to 2025; prosecutors said they could reach "millions of computers and devices around the world, including in the United States" (D, <a href="https://www.courtlistener.com/docket/71644417/united-states-v-williams/">U.S. v. Williams</a>). L3Harris also runs the FAA network DOT is replacing. <em>Sequence:</em> the one confirmed attack of the week may have hit Americans with an American-made weapon that passed through Russian and Chinese hands, so a foreign label fits
      whichever country an official picks {P}. <em>Sequence:</em> a real supply-chain attack, exploit kits with state-actor history, Iranian attacks on record in sworn testimony and an active war give any official who wants a foreign culprit the raw material; none has said it {P}.
