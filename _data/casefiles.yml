    status: armed
    html: 'still no U.S. agency attribution of any current incident to a foreign country; Bloomberg: "Iran Hit Key Infrastructure, Isn''t Behind Tech Outages, US Says" (R, headline). The public "Iran did it" claim comes from commentary: a former intelligence officer on LBC said "I think the Trump administration is not being honest by the way, about who is behind these attacks" (R, <a href="https://www.express.co.uk/news/world/2267083/iran-behind-us-tech-outages">Daily Express</a>, Nov 17). New, the one confirmed attack of the week (D, <a href="https://status.optimizely.com/incidents/ftw0fh9wx43z">Optimizely</a>): "On 16 November 2026, an unauthorized third party exploited a flaw in the Optimizely Web Experimentation account signup flow," impersonated users and inserted malicious scripts into customer projects. Researchers found the code on 178 organizations'' sites (banks, airlines, CNN, BBC, Fox News, Equifax), serving a card skimmer and the Coruna and DarkSword iPhone exploit kits, which
      Google earlier tied to spyware vendors and a suspected Russian espionage group; no attribution, no government site named (R, <a href="https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/">Report URI</a>, <a href="https://krebsonsecurity.com/2026/11/attackers-used-optimizely-to-a-b-test-malware-on-top-websites/">Krebs</a>).'
