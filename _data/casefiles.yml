  - date: '2026-11-19'
    label: Nov 19
    tw: 3
    tw_name: Emergency declaration
    status: armed
    html: the NSA outage kept much of the workforce home for three days and cut NSA Georgia, the hub for Middle East signals intelligence during the Iran war, off its classified network; a Thursday voicemail called it a "code orange," with the campus closed "until further notice" (R, <a href="https://www.cnn.com/2026/11/18/politics/nsa-outage-disrupts-georgia-intel-hub-middle-east-intelligence">CNN</a>, Nov 18). Officials say it "appeared connected to the NSA's handling of software updates for vulnerabilities in PHP," the PHP2Shell flaws NSA itself told everyone to patch on Oct 21 (D, <a href="https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching">CISA/NSA/FBI alert</a>). The White House says the government knew of the flaw by Oct 16 (R, Reuters), and OpenAI says it coordinated the disclosure with the White House Super Intelligence Force, ONCD and CISA (R).
  - date: '2026-11-19'
    label: Nov 19
    tw: 3
    tw_name: Emergency declaration
    status: armed
    html: 'a second, separate AI-found PHP flaw, "phpAfterShell," was fixed today; the October patches "do not contain the fix," so every agency that just patched has to patch again (D, <a href="https://depthfirst.com/phpaftershell">depthfirst</a>; R, <a href="https://www.forbes.com/sites/thomasbrewster/2026/11/19/ai-finds-critical-vulnerability-in-php-again/">Forbes</a>). The finder''s CEO warns the patches themselves can make systems fail (R). The NSA''s Oct 21 advisory had said PHP2Shell was "serious enough to require immediate patching across United States Government departments and agencies" (D); CISA put both PHP2Shell flaws on its binding must-patch list on Oct 26 with an Oct 29 deadline for civilian agencies (D, <a href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog">CISA KEV</a>); its directives do not reach national security systems like NSA''s, whose patch went in about Nov 7 (R, CBS, DNI Clayton) {P}. <em>Sequence:</em> the official cause of the week''s outages
      is now AI-found bugs and rushed patches, a cause that needs no foreign country; a "significant incident" declaration doesn''t need one either, since harm to "public confidence" counts {P}. (R, Washington Sun; D, TRM release, Nov 18): DHS and DOJ opened a "Threat Disruption Center" inside the Homeland Security Task Force''s National Coordination Center, with a no-bid AI vendor as "primary private-sector partner" (row 26). <em>Sequence:</em> the response capacity grows while every official says the outages were not attacks {P}. (D, written testimony, Nov 18): Mullin told House Homeland that CISA has shifted "from passively defending toward proactively identifying, mitigating, and reducing malicious access to critical infrastructure," launched "CI Fortify" to prepare operators "for sustained essential operations during a potential geopolitical conflict," and named "cybersecurity attacks from adversarial super intelligence (SI)" as a threat; he did not mention the outages'' cause or any
      emergency. FAA chief Bedford: "I take full responsibility" for the ground stop (R, CNN). <em>Sequence:</em> CISA''s act-first language now matches the Pentagon''s "at their source" cyber posture of Sept 22 {P}. (R, CNN, Nov 18): a senior administration official says the outages are "the results of preparing for, hardening, upgrading your systems," and, asked how systems would handle a real attack, "That is a question the American people should be asking"; NSA patching is "slower than expected"; Vance cancelled a New York appearance to attend "meetings amid the wave of outages." (R, Washington Sun, Nov 17): bank executives and the NSA told members of Congress the outages came from rushed fixes for vulnerabilities "identified by artificial intelligence"; Mullin on CNBC: "We''re going to see more of this as new technology rolls out." <em>Sequence:</em> crisis meetings at the vice-president level with no declaration and an official line of "not an attack"; Mullin pre-announces more failures,
      which keeps the emergency frame ready without a predicate {P}. (D, USAspending, Nov 18): the emergency is so far a word, not a contract. No new FAA award to L3Harris, AT&amp;T, Verizon, Lumen, Peraton, Juniper, Cisco or HPE since Nov 1 (D, USAspending; data lags). In August the FAA had already moved its replacement telecom network to AT&amp;T in a deal coded "NOT COMPETED" and "UNIQUE SOURCE," with one offer (D). That August award already does the work an emergency purchase would {P}. Duffy''s $50 billion request names "AT&amp;T, Verizon, and Lumen" as builders (D, DOT). <em>Watch:</em> a ceiling increase for Peraton, new contract vehicles, or the AT&amp;T letter contract being made final.'
