    tw_name: FBI or DOJ take an election “investigation” or the evidence
    status: fired
    html: 'a Georgia judge ordered Fulton County to give the State Election Board unredacted copies of the 2020 election records the FBI seized in January, under a protective order. (R, <a href="https://apnews.com/article/alaska-voter-rolls-noncitizens-justice-department-b3ba0862276b69469a4b72b433db1013">AP</a>, Nov 24): Alaska''s lieutenant governor ended the state''s voter-roll sharing agreement with DOJ; reported: no removals resulted and DOJ flagged no one; legislators ask whether DOJ still holds the data. (D, <a href="https://www.courtlistener.com/docket/72334921/68/united-states-v-henderson/">U.S. v. Henderson, D. Utah 2:26-cv-00166, ECF 68</a>, Oct 23, surfaced Nov 23): Judge Barlow dismissed DOJ''s Civil Rights Act suit for Utah''s voter list with prejudice: "Utah''s SVRL is not subject to a Title III demand," and amendment "would be futile." <em>Meaning {P}:</em> the 52 U.S.C. 20701 route to full state voter files is losing in court; the grand-jury route is what remains. {R} New
      (R, <a href="https://www.ajc.com/politics/2026/11/fbi-questions-former-fulton-elections-director/">AJC</a>, Nov 21; NYT first): two FBI agents and two federal prosecutors, including Dan Bishop, the U.S. attorney named to prosecute election fraud nationwide, and Hugh Raymond Evans, the agent who signed the Jan 28 Fulton ballot-seizure affidavit, questioned Fulton''s 2020 elections director Richard Barron for more than two hours. NYT (via summary): 10 months after the seizure, 260 analysts assigned, no charges.'
  written_html:
    What's going on: '<p>Before the election, DOJ told election officials in all 50 states to preserve their records for 22 months, ballots included. {R} After it, the pressure moved to grand juries: subpoenas from the U.S. Attorney for the Northern District of California ask county election chiefs how they answered DOJ''s demand to confirm citizenship or set aside the ballots of "suspected aliens." {R}</p>

      <p>DOJ''s acting Voting Section chief told New Hampshire''s Secretary of State in September that he is under criminal investigation for refusing the unredacted voter list. {R} In Fulton County, two FBI agents and two federal prosecutors, including the U.S. attorney named to prosecute election fraud nationwide, questioned the county''s 2020 elections director for more than two hours. {R}</p>

      <p>A federal judge in Washington barred DOJ and DHS from demanding that officials set aside the ballots of voters on a federal list: "A threat of prosecution made for that purpose is not legal advice. It is the pressure that makes the demand work." {D}</p>'
    What we presume: <ul><li>{P} Each time a court stopped a civil demand, the criminal route stayed open, so the pressure on the people who count outlasts the election.</li></ul>
