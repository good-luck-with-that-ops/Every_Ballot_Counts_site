  written_html:
    What's going on: '<p>Voter, tax, Social Security, housing and immigration records are being wired to USCIS''s SAVE, the federal citizenship check. The Social Security Administration says that "through data received from ... SAVE" it has updated about 25 million records that were missing citizenship information. {D}</p>

      <p>HUD will run every assisted tenant, citizens and children included, through SAVE from Dec 14, and housing agencies "must inform DHS immediately" when they find someone present in violation of immigration law. {D} State''s online passport pilot runs through America.gov and Login.gov, with citizenship checked "using system checks, including those from USCIS." {D}</p>

      <p>Login.gov, the sign-in people use for Social Security, passports and federal jobs, now keeps the ID photos and selfies people submit "until business use ceases" and gives partner agencies the key: an agency "may retain the ability to decrypt a user''s images after Login.gov itself can no longer decrypt them." {D} On Oct 28 its public terms were rewritten to match: information about identity checks, "including attempts you do not complete," goes to partner agencies that have a fraud agreement, and "Terminating your account does not delete information retained for fraud detection and investigation." {D} Login.gov''s records notice in the Federal Register hasn''t been updated since May 2024. {D}</p>

      <p>GSA has asked commercial identity companies to hand over their customers'' full proofing records, selfies included, "for investigation purposes," {D} and it built a prototype for sharing fraud flags across agencies, keyed to hashed Social Security numbers. {D} Login.gov''s code now asks people to "Let America.gov act for you," sharing "Full name, date of birth, Social Security number, mailing address" with the White House''s AI front door. {D}</p>

      <p>DHS and DOJ also compiled lists of named voters they call likely noncitizens. On Nov 2 Judge Chutkan stayed any further release of those lists to election officials; the court found no Privacy Act notice covers the compiled voter data. {D} DOJ has sued 30 states and D.C. for full voter rolls and lost 28. {R}</p>'
    What we presume: '<ul><li>{P} The same door now serves voting, housing, benefits and passports, so whoever runs the match decides who gets flagged.</li><li>{P} With the SAVE America Act dead, proof of citizenship moves to SAVE agreements with cooperating states for 2028.</li><li>{P} None of this needs a voter file to matter for elections: citizenship, identity and fraud flags gathered for benefits can be run against the rolls by whoever holds the keys.</li></ul>'
