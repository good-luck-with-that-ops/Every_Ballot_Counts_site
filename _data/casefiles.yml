  written_html:
    What's going on: '<p>Mississippi''s Secretary of State, Michael Watson, paid Experian $50,000 for its TrueTrace "Best Address" locator and ran about 1.9 million voter checks. The contract says Experian "cannot and will not ... be an insurer or guarantor of the accuracy or reliability" of its data. {R}</p>

      <p>Voters inactivated through that process were pushed to affidavit ballots in November. Hinds County rejected about two-thirds of its affidavit ballots, {R} and Watson put the statewide acceptance rate at "roughly 76%." {D} His office had also deleted the state''s mail-ballot cure rule in August. {R}</p>

      <p>Watson''s defense: "The system at the end of the day… is working as it was designed." {R}</p>'
    What we presume: <ul><li>{P} How many rejected affidavit voters were inactivated through the Experian process is still unreported. That number is the 2028 evidence.</li><li>{P} The 2026 upload means the commercial data shaped this year's rolls, not only 2025's.</li></ul>
