  written_html:
    What's going on: '<p>Some states aren''t waiting for a federal list. They run the checks on their own rolls, with federal systems or with commercial data.</p>

      <p>Mississippi''s Secretary of State, Michael Watson, paid Experian $50,000 for its TrueTrace "Best Address" locator and ran about 1.9 million voter checks. The contract says Experian "cannot and will not ... be an insurer or guarantor of the accuracy or reliability" of its data. {R} Voters inactivated through that process were pushed to affidavit ballots in November. Hinds County rejected about two-thirds of its affidavit ballots, {R} and Watson put the statewide acceptance rate at "roughly 76%." {D} His defense is that the affidavit ballot "is a catch-all. If we made any mistakes, any errors, we were caught by this affidavit process." {R} The ACLU is weighing a challenge, and legislators plan changes in January. {R}</p>

      <p>Texas ran about 18 million registrations through SAVE, the federal citizenship check, and flagged 2,724 people as possible noncitizens. 578 of them turned out to be citizens, 506 only after passport data was added to SAVE. {D}</p>

      <p>Texas isn''t alone. USCIS''s own list of SAVE users shows 28 state election offices registered for voter checks, along with 68 Florida county election supervisors and DOJ''s Civil Rights Division. {D} Every one of those 28 states also has at least one 287(g) agreement with ICE. {D}</p>

      <p>DOJ is backing the states that want proof of citizenship up front. On Nov 24 its Civil Rights Division filed a brief supporting Ohio''s rule that people registering to vote at the BMV must first show citizenship documents. {D}</p>

      <p>Not every partner stayed. On Nov 24 Alaska ended its voter-roll sharing and flagging agreement with DOJ. No voters were removed and DOJ flagged no one, and state lawmakers now want to know whether DOJ still has the data. {R}</p>'
    What we presume: <ul><li>{P} How many of Mississippi's rejected affidavit voters were inactivated through the Experian process is still unreported. That number is the 2028 evidence.</li><li>{P} In Texas, citizens got cleared only because someone added passport data to the check. A state that skips that step, or uses a commercial file instead, clears fewer of them.</li><li>{P} The states already signed up for SAVE voter checks are a ready-made route to proof of citizenship for 2028, whether or not Congress ever requires it.</li></ul>
