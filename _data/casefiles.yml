    tw_name: The voting-machine claim
    status: armed
    html: 'Judge Kacsmaryk dismissed the hand-count suit without prejudice for lack of standing. The plaintiffs had argued that Texas machines "contain components manufactured by foreign adversaries"; the court: "Plaintiffs do not have standing to challenge voting machines that have been affected by potentially hostile actors," and the slogan "election security is national security" "cannot be a Trojan horse for circumventing Article III." This replaces the Nov 24 line on the Nov 27/30 briefing schedule. <em>Meaning {P}:</em> the private route to a machine claim failed on standing; the routes that need no standing are executive ones (EO 13873, CISA, a "significant incident"). {D}'
    source: <a href="https://www.courtlistener.com/docket/75028945/88/potter-county-republican-party-v-benge/">Potter County v. Benge, ECF 88-89</a>
