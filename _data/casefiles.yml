  written_html:
    What's going on: '<p>On Nov 13 the FAA stopped every departing flight in the country for almost five hours. CBS sources said an update to the L3Harris-run network that links air traffic control caused a reboot and crash. {R} The Transportation Secretary, Sean Duffy, said "It wasn''t a foreign actor," and "until I can build that, I''m stuck with L3Harris, who owns this network." {R} The ties go deeper than a contract he''s stuck with. In July L3Harris announced an FAA contract to run the nation''s aircraft tracking network through 2045, and in April the Department of War agreed to buy about $1 billion of preferred stock in its missile subsidiary. {D}</p>

      <p>Then came the break-ins. The FBI is investigating a suspected breach of NCIC, the database police across the country use to share criminal justice information. {R} USDA told employees on Nov 19 that hackers got into the system it uses to pay farmers. {R} The CIA and ODNI found a breach of "an open-source intelligence analysis system," which may have exposed information from other agencies. {R} On Nov 24 FinCEN, Treasury''s financial-crimes unit, said it was investigating "unauthorized access to a limited subset of its systems." {R} OPM separately confirmed that an outside party got into 403 tentative federal job offers on Nov 12 and 13. {R}</p>

      <p>No official has named who did any of it. The Director of National Intelligence, Jay Clayton, said of the outages: "this is not a cyberattack, and this is not a coordinated effort by a nation state." {R} The President''s take on the NCIC hack: "Maybe we''ll learn about the voter fraud, all the voter fraud that took place." {R}</p>

      <p>The one confirmed attack of the stretch hit private websites. On Nov 16 an attacker used a flaw in Optimizely''s signup flow to plant malicious code on 178 organizations'' sites. {D} Researchers found it serving Coruna, an iPhone exploit kit that two former L3Harris employees say was built at least in part by Trenchant, L3Harris''s hacking-tools unit. {R} Trenchant''s former general manager pleaded guilty to selling eight of its tools, made for the U.S. government and its allies, to a Russian broker. {D}</p>'
    What we presume: <ul><li>{P} The government isn't stuck with L3Harris. It's a shareholder.</li><li>{P} Attribution is still open on every one of the intrusions, so a foreign-blame announcement stays available on whatever timing suits the people who would make it.</li><li>{P} Clayton is on record that the outages weren't a nation-state attack. He also owes the President a foreign-interference assessment around Dec 18. If the break-ins get a country's name before then, ask what changed.</li></ul>
