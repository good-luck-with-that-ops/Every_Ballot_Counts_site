    html: 'the Office of the National Cyber Director "will be integrated into a reorganized White House operational and policy structure"; cyber teams "will be reorganized under the National Security Council and Homeland Security Council"; "Next week, DOJ and FBI will unveil their latest cyber defense initiative." <em>Meaning {P}:</em> the statutory consultee for a significant-incident declaration (6 U.S.C. 677b) moves under council staff while the DNI is acting cyber director. Earlier check, Nov 25 ~5 pm: Federal Register API Nov 23-25: 0 for "significant incident," "emergency directive," "major incident," "national security system," "Insurrection Act," "12304," "foreign adversary"; "national emergency" 3 routine notices. Current public inspection (141 items): nothing under 6 U.S.C. 677-677c or 44 U.S.C. 3553(h)/3554; the one special filing is the capital-sentences memo (row 27). CISA''s 10 KEV additions (Danfoss, Juniper, Mitel, Xen Orchestra) name no election vendor and no directive.
      cisa.gov refused the shell (403); the directives page was read in the browser this morning. FinCEN: a person familiar says no evidence the BSA or beneficial-ownership databases were breached (R, Reuters); no "major incident" notice reported. No "likely to occur imminently" statement, no Cyber Response and Recovery Fund use, no 10 U.S.C. 12304(c) action. Earlier check, Nov 25 am: CISA directives page read in the browser: no new emergency directive (latest ED 26-03; latest BOD 26-04), none naming an election system, DOJ, DHS, SSA, the EAC or a contractor platform. Federal Register API Nov 22-25 for "significant incident," "emergency directive," "major incident," "national security system," "Insurrection Act," "12304," "foreign adversary": 0; current public inspection (136 items): nothing under 6 U.S.C. 677-677c or 44 U.S.C. 3553(h)/3554. No statement that an election incident is under way or "likely to occur imminently." No "major incident" notice to Congress reported for NCIC, CIA/ODNI
      or FinCEN. {D}'
