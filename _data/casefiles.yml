  written_html:
    What's going on: '<p>On Nov 13 the FAA stopped every departing flight in the country for almost five hours. CBS sources said an update to the L3Harris-run network that links air traffic control caused a reboot and crash. {R} The Transportation Secretary, Sean Duffy: "It wasn''t a foreign actor," and "until I can build that, I''m stuck with L3Harris, who owns this network." {R}</p>

      <p>The government signed new deals with the same company this year. On July 1 L3Harris announced an FAA contract to run the nation''s aircraft tracking network through 2045, and in April the Department of War agreed to buy about $1 billion of preferred stock in its missile subsidiary. {D}</p>

      <p>From 2022 to 2025 the general manager of Trenchant, L3Harris''s hacking-tools unit, sold at least eight of its tools, made for the U.S. government and allies, to a Russian broker. He pleaded guilty. {D}</p>

      <p>The day before the outage, the budget director and the Transportation Secretary asked appropriators for $30.1 billion more for aviation. {R}</p>'
    What we presume: <ul><li>{P} The government isn't stuck with L3Harris. It is a shareholder.</li><li>{P} No official has tied the outage to a foreign actor. Whoever first does would be pointing at a network run by a company whose own hacking tools reached Russia.</li></ul>
