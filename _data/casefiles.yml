    html: 'Judge Kelly Lee Ellerbe "granted the county''s request to halt her order while the appeal is pending"; the State Election Board does not get the FBI-seized 2020 records for now. This replaces the Nov 24 line below as current. <em>History (Nov 24, now stayed):</em> a Georgia judge ordered Fulton County to give the State Election Board unredacted copies of the 2020 election records the FBI seized in January, under a protective order. (R, <a href="https://apnews.com/article/alaska-voter-rolls-noncitizens-justice-department-b3ba0862276b69469a4b72b433db1013">AP</a>, Nov 24): Alaska''s lieutenant governor ended the state''s voter-roll sharing agreement with DOJ; reported: no removals resulted and DOJ flagged no one; legislators ask whether DOJ still holds the data. (D, <a href="https://www.courtlistener.com/docket/72334921/68/united-states-v-henderson/">U.S. v. Henderson, D. Utah 2:26-cv-00166, ECF 68</a>, Oct 23, surfaced Nov 23): Judge Barlow dismissed DOJ''s Civil Rights Act suit
