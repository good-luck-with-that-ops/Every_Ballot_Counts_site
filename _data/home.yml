# The front page. Amanda curates it weekly; the publisher does not change the lead or the note.
week_of: "2026-11-16"
lead:
  kicker: "Lead · Tripwire 1 · Foreign blame for a current hack"
  tripwire: 1
  headline: "The FBI’s AI-hacking alert names no country. Its own footnote does."
  dek: "The Nov 13 FLASH on the ARTEX framework went out the afternoon of the FAA ground stop. Its second note cites Microsoft’s report on a “nation-state campaign,” which calls the attacker “a China-state aligned actor.” {D} The country is on the record, one official sentence away. {P}"
