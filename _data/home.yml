    img: fbi-flash-261113-p12
    focus: 28
    alt: "FBI FLASH-20261113-001, Notes, page 12. Note 2: Microsoft Security Research and Microsoft Threat Intelligence, “AI-driven, large-scale nation-state campaign using ARTEX enables supply chain compromise,” October 21, 2026."
    caption: "FBI FLASH-20261113-001, Nov 13, 2026, the alert’s list of notes, page 12. Highlighting is ours."
note:
  date: "2026-11-17"
  text: "The FBI read the report that names China, cited it, and left the country out of its own alert. That blank is row 1, and whoever fills it in decides what comes next: a foreign-interference finding, an emergency declaration, 120 days. I wrote about it in <a href=\"https://www.presumptionofirregularity.com/p/fill-in-the-blank-________-state\">Fill in the Blank</a>. If an official says the country out loud, this row moves first."
