# The front page. Amanda curates it weekly; the publisher does not change the lead or the note.
week_of: "2026-11-09"
lead:
  kicker: "Lead · Tripwire 17 · The voting-machine claim"
  tripwire: 17
  headline: "Georgia’s election board told Homeland Security its voting machines are “protected computers”"
  dek: "The board’s Sept 28 resolution calls the machines federal “critical infrastructure” and asks that copies of the election server and scanner hard drives go to DHS and the Justice Department. {D} That is the wording that turns a machine problem into an FBI case. {P}"
  doc_url: /assets/docs/ga-seb-letter-and-resolution-2026-09-30.pdf
  doc_label: "Read the resolution"
  exhibit:
    img: ga-seb-resolution-p4
    focus: 56
    alt: "Georgia State Election Board resolution, adopted Sept 28, 2026, page 4: “the Federal government has deemed the voting systems to be ‘critical infrastructure’ and the Dominion systems are ‘protected computers’ within the meaning of 18 U.S.C. § 1030(e).”"
    caption: "Georgia State Election Board, resolution adopted Sept 28, 2026, sent to DHS and DOJ Sept 30. Page 4 of 5. Highlighting is ours."
note:
  date: "2026-11-14"
  text: "The election is over and the paperwork is not. This week a state board handed Washington the exact vocabulary a federal machine case would need, and nobody federal has picked it up. I checked. If someone does, row 17 moves first."
