# The front page. Amanda curates it weekly; the publisher does not change the lead or the note.
week_of: "2026-11-22"
lead:
  kicker: "Lead · Tripwire 1 · Foreign blame for a current hack"
  tripwire: 1
  headline: "The intelligence chief ruled out a state sponsor for the outages. For the two hacks, he ruled out nothing."
  dek: "Jay Clayton owes the President an assessment of foreign interference in the midterms “Not later than 45 days after the conclusion of” the election, which is about Dec 18. {D} On Nov 22 he said of the month’s outages, “we know that they were not coordinated and that they were not state sponsored.” Asked who broke into the FBI and the Agriculture Department: “Again, not getting into specifics.” {R} For the two confirmed break-ins, no official has named a country or ruled one out. {P}"
  doc_url: "https://www.federalregister.gov/documents/2018/09/14/2018-20203/imposing-certain-sanctions-in-the-event-of-foreign-interference-in-a-united-states-election"
  doc_label: "Read the order"
  exhibit:
    img: eo13848-p1
    focus: 60
    alt: "Executive Order 13848 of September 12, 2018, Federal Register page 46843. Highlighted, section 1(a): “Not later than 45 days after the conclusion of a United States election, the Director of National Intelligence ... shall conduct an assessment of any information indicating that a foreign government ... has acted with the intent or purpose of interfering in that election.”"
    caption: "Executive Order 13848, Sept 12, 2018, section 1(a), 83 Fed. Reg. 46843. Highlighting is ours."
note:
  date: "2026-11-22"
  text: "“Again, not getting into specifics” and “transparency is key” in the same interview is actually pretty hilarious, even to me. The man who said both is Jay Clayton, and he writes the foreign-interference report due around Dec 18, which makes him row 1. I read his Sunday answers closely in <a href=\"https://www.presumptionofirregularity.com/p/put-jay-out-there\">Put Jay Out There</a>."
